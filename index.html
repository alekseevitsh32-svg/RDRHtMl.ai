    ctx.fillStyle = 'rgba(240,220,174,0.95)';
    ctx.font = 'bold 13px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('ПЕРЕЗАРЯДКА', цx, цy + 46);
    ctx.textAlign = 'left';
  }

  /* Мини-карта */
  нарисоватьМиниКарту();
}

function скругПрямоуг(c, x, y, w, h, r) {
  r = Math.min(r, w * 0.5, h * 0.5);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}

function нарисоватьСердце(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, r * 0.3);
  ctx.bezierCurveTo(-r, -r * 0.4, -r, -r, 0, -r * 0.5);
  ctx.bezierCurveTo(r, -r, r, -r * 0.4, 0, r * 0.3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function нарисоватьГлаз(x, y, r, активен) {
  ctx.save();
  ctx.translate(x, y);

  /* Внешний контур */
  ctx.strokeStyle = активен ? '#fff2b0' : '#d8a83a';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r * 0.6, 0, 0, ДВА_ПИ);
  ctx.stroke();

  /* Зрачок */
  ctx.fillStyle = активен ? '#fff2b0' : '#d8a83a';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.35, 0, ДВА_ПИ);
  ctx.fill();

  ctx.restore();
}

/* ---------- Мини-карта ---------- */
function нарисоватьМиниКарту() {
  const S = 150;
  const px = Ш_ЭКРАНА - S - 20;
  const py = 20;
  const дальность = 12;
  const к = S / (дальность * 2);
  const цx = px + S / 2;
  const цy = py + S / 2;

  ctx.save();
  ctx.beginPath();
  скругПрямоуг(ctx, px, py, S, S, 8);
  ctx.clip();

  ctx.fillStyle = 'rgba(22,14,7,0.85)';
  ctx.fillRect(px, py, S, S);

  for (let y = 0; y < РАЗМЕР_КАРТЫ; y++) {
    for (let x = 0; x < РАЗМЕР_КАРТЫ; x++) {
      const клетка = КАРТА[y * РАЗМЕР_КАРТЫ + x];
      if (!клетка) continue;
      const worldX = x + 0.5;
      const worldY = y + 0.5;
      const dx = worldX - игрок.x;
      const dy = worldY - игрок.y;
      if (Math.abs(dx) > дальность || Math.abs(dy) > дальность) continue;

      const экX = цx + dx * к;
      const экY = цy + dy * к;

      let цвет0;
      if (клетка === 1) цвет0 = 'rgba(150,110,60,0.92)';
      else if (клетка === 2) цвет0 = 'rgba(150,85,65,0.92)';
      else if (клетка === 3) цвет0 = 'rgba(125,120,112,0.92)';
      else if (клетка === 4) цвет0 = 'rgba(210,175,80,0.95)';
      else if (клетка === 5) цвет0 = 'rgba(90,85,80,0.92)';
      else цвет0 = 'rgba(150,110,60,0.9)';

      ctx.fillStyle = цвет0;
      ctx.fillRect(экX - к * 0.5, экY - к * 0.5, к + 0.5, к + 0.5);
    }
  }

  /* Враги */
  for (const с of спрайты) {
    if (с.тип !== 'враг') continue;
    const dx = с.x - игрок.x;
    const dy = с.y - игрок.y;
    if (Math.abs(dx) > дальность || Math.abs(dy) > дальность) continue;
    ctx.fillStyle = '#e0503c';
    ctx.beginPath();
    ctx.arc(цx + dx * к, цy + dy * к, 3.2, 0, ДВА_ПИ);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,180,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  /* Декор */
  for (const с of спрайты) {
    if (с.тип !== 'кактус' && с.тип !== 'бочка') continue;
    const dx = с.x - игрок.x;
    const dy = с.y - игрок.y;
    if (Math.abs(dx) > дальность || Math.abs(dy) > дальность) continue;
    ctx.fillStyle = с.тип === 'кактус' ? 'rgba(80,150,80,0.9)' : 'rgba(170,110,60,0.9)';
    ctx.beginPath();
    ctx.arc(цx + dx * к, цy + dy * к, 2.2, 0, ДВА_ПИ);
    ctx.fill();
  }

  /* Игрок */
  ctx.fillStyle = '#fff6d8';
  ctx.beginPath();
  ctx.arc(цx, цy, 4.5, 0, ДВА_ПИ);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* Направление */
  ctx.strokeStyle = 'rgba(255,246,216,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(цx, цy);
  ctx.lineTo(цx + Math.cos(игрок.угол) * 18, цy + Math.sin(игрок.угол) * 18);
  ctx.stroke();

  /* Сектор обзора */
  ctx.fillStyle = 'rgba(255,200,120,0.13)';
  ctx.beginPath();
  ctx.moveTo(цx, цy);
  ctx.arc(цx, цy, 42, игрок.угол - 0.5, игрок.угол + 0.5);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  /* Рамка */
  ctx.strokeStyle = 'rgba(220,190,140,0.6)';
  ctx.lineWidth = 2;
  скругПрямоуг(ctx, px, py, S, S, 8);
  ctx.stroke();

  ctx.fillStyle = 'rgba(220,190,140,0.85)';
  ctx.font = 'bold 11px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('КАРТА', px + 8, py - 6);
}

/* ---------- Кнопки тача ---------- */
function нарисоватьКнопкиТач() {
  for (const к of кнопки) {
    const x = к.x(), y = к.y(), r = к.r;

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.arc(x, y + 3, r + 2, 0, ДВА_ПИ);
    ctx.fill();

    const гр = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 2, x, y, r);
    гр.addColorStop(0, к.цвет);
    гр.addColorStop(1, 'rgba(40,25,12,0.95)');
    ctx.fillStyle = гр;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, ДВА_ПИ);
    ctx.fill();

    ctx.strokeStyle = 'rgba(220,190,140,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, ДВА_ПИ);
    ctx.stroke();

    /* Блик */
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.5, 0, ДВА_ПИ);
    ctx.fill();

    ctx.fillStyle = '#f0dcae';
    ctx.font = 'bold 13px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 3;
    ctx.fillText(к.метка, x, y + 1);
    ctx.shadowBlur = 0;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    ctx.restore();
  }
}

function нарисоватьСтик(ст, цвет_ст) {
  if (!ст.активен) return;
  const { ox, oy, x, y } = ст;

  ctx.save();
  ctx.fillStyle = 'rgba(20,12,6,0.35)';
  ctx.beginPath();
  ctx.arc(ox, oy, РАДИУС_СТИКА, 0, ДВА_ПИ);
  ctx.fill();
  ctx.strokeStyle = 'rgba(220,190,140,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(ox, oy, РАДИУС_СТИКА, 0, ДВА_ПИ);
  ctx.stroke();

  const dx = x - ox, dy = y - oy;
  const дл = Math.hypot(dx, dy);
  const макс = РАДИУС_СТИКА;
  let кx, кy;
  if (дл > макс) {
    кx = ox + dx / дл * макс;
    кy = oy + dy / дл * макс;
  } else {
    кx = x; кy = y;
  }

  const гр = ctx.createRadialGradient(кx, кy, 2, кx, кy, 30);
  гр.addColorStop(0, цвет_ст);
  гр.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = гр;
  ctx.beginPath();
  ctx.arc(кx, кy, 30, 0, ДВА_ПИ);
  ctx.fill();

  ctx.fillStyle = 'rgba(240,220,174,0.9)';
  ctx.beginPath();
  ctx.arc(кx, кy, 20, 0, ДВА_ПИ);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90,60,25,0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(кx, кy, 20, 0, ДВА_ПИ);
  ctx.stroke();

  /* Блик */
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.arc(кx - 5, кy - 5, 6, 0, ДВА_ПИ);
  ctx.fill();

  ctx.restore();
}

/* ---------- Меню ---------- */
function нарисоватьМеню() {
  ctx.fillStyle = 'rgba(14,9,5,0.75)';
  ctx.fillRect(0, 0, Ш_ЭКРАНА, В_ЭКРАНА);

  const гр = ctx.createRadialGradient(Ш_ЭКРАНА / 2, В_ЭКРАНА / 2, 80, Ш_ЭКРАНА / 2, В_ЭКРАНА / 2, Math.max(Ш_ЭКРАНА, В_ЭКРАНА) * 0.85);
  гр.addColorStop(0, 'rgba(90,60,25,0.30)');
  гр.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = гр;
  ctx.fillRect(0, 0, Ш_ЭКРАНА, В_ЭКРАНА);

  ctx.textAlign = 'center';

  ctx.fillStyle = '#e8c98a';
  ctx.font = 'bold ' + Math.min(70, Ш_ЭКРАНА / 12) + 'px Georgia, serif';
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 14;
  ctx.fillText('RED DEAD 3D', Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 - 130);
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(232,201,138,0.6)';
  ctx.font = Math.min(20, Ш_ЭКРАНА / 32) + 'px Georgia, serif';
  ctx.fillText('— вестерн от первого лица —', Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 - 88);

  ctx.fillStyle = 'rgba(232,220,190,0.9)';
  ctx.font = Math.min(16, Ш_ЭКРАНА / 48) + 'px Georgia, serif';

  const строки = ЭТО_ТАЧ ? [
    'Левый палец — виртуальный стик движения',
    'Правый палец — обзор, короткий тап — выстрел',
    'Кнопки: ПЕР — перезарядка, ГЛАЗ — Меткий глаз, БЕГ — бег'
  ] : [
    'WASD — движение        Мышь — обзор        ЛКМ — огонь',
    'R — перезарядка        Q — Меткий глаз    Shift — бег',
    'Целься мышью в центр экрана — там летят пули'
  ];

  строки.forEach((т, i) => {
    ctx.fillText(т, Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 - 20 + i * 32);
  });

  const пульс = 0.55 + Math.sin(performance.now() / 350) * 0.45;
  ctx.fillStyle = 'rgba(255,225,150,' + пульс + ')';
  ctx.font = 'bold ' + Math.min(24, Ш_ЭКРАНА / 30) + 'px Georgia, serif';
  ctx.fillText(ЭТО_ТАЧ ? 'КОСНИСЬ ЭКРАНА, ЧТОБЫ НАЧАТЬ' : 'КЛИКНИ ИЛИ ПРОБЕЛ — НАЧАТЬ',
               Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 + 150);

  ctx.textAlign = 'left';
}

/* ---------- Конец игры ---------- */
function нарисоватьКонец() {
  ctx.fillStyle = 'rgba(30,4,4,0.75)';
  ctx.fillRect(0, 0, Ш_ЭКРАНА, В_ЭКРАНА);

  ctx.textAlign = 'center';

  ctx.fillStyle = '#c0392b';
  ctx.font = 'bold ' + Math.min(72, Ш_ЭКРАНА / 10) + 'px Georgia, serif';
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 14;
  ctx.fillText('ТЫ ПОГИБ', Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 - 80);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#e8c98a';
  ctx.font = 'bold 32px Georgia, serif';
  ctx.fillText('$ ' + счёт, Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 + 6);

  ctx.fillStyle = 'rgba(232,220,190,0.85)';
  ctx.font = Math.min(18, Ш_ЭКРАНА / 44) + 'px Georgia, serif';
  ctx.fillText('Врагов уложено: ' + убийств, Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 + 50);
  ctx.fillText('Продержался: ' + Math.floor(время) + ' секунд', Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 + 78);

  const пульс = 0.55 + Math.sin(performance.now() / 350) * 0.45;
  ctx.fillStyle = 'rgba(255,225,150,' + пульс + ')';
  ctx.font = 'bold ' + Math.min(22, Ш_ЭКРАНА / 36) + 'px Georgia, serif';
  ctx.fillText(ЭТО_ТАЧ ? 'КОСНИСЬ ЭКРАНА — НАЧАТЬ ЗАНОВО' : 'НАЖМИ  R  ЧТОБЫ НАЧАТЬ ЗАНОВО',
               Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 + 150);

  ctx.textAlign = 'left';
}

/* ==========================================================
   13. ГЛАВНЫЙ ЦИКЛ
   ========================================================== */
let последнийКадр = performance.now();

function цикл(t) {
  let dt = (t - последнийКадр) / 1000;
  последнийКадр = t;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  обновить(dt);
  отрисоватьКадр();
  нарисоватьПоверх();

  requestAnimationFrame(цикл);
}

/* ==========================================================
   14. СТАРТ
   ========================================================== */
window.addEventListener('touchstart', function однажды() {
  window.removeEventListener('touchstart', однажды);
  window.scrollTo(0, 1);
}, { passive: true });

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());

requestAnimationFrame(цикл);
</script>
