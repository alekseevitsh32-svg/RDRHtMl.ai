<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#140d07">
<title>Red Dead Canvas — Вестерн</title>
<style>
  /* ==========================================================
     БАЗОВЫЕ СТИЛИ
     ========================================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #140d07;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: Georgia, "Times New Roman", serif;
  }

  canvas {
    display: block;
    touch-action: none;
    cursor: crosshair;
    background: #cf9f5e;
  }

  /* Подсказка внизу — только для клавиатуры */
  #подсказка {
    position: fixed;
    left: 0; right: 0; bottom: 6px;
    text-align: center;
    color: #e8d5b0;
    font: 12px Georgia, serif;
    opacity: .38;
    pointer-events: none;
    text-shadow: 0 2px 6px #000;
    letter-spacing: .4px;
    padding: 0 10px;
  }

  /* На тач-устройствах подсказка не нужна */
  @media (pointer: coarse) {
    #подсказка { display: none; }
  }
</style>
</head>
<body>
<canvas id="игра"></canvas>
<div id="подсказка">WASD — движение · Мышь — прицел · ЛКМ — огонь · R — перезарядка · Q — Меткий глаз · E — конь · Shift — бег</div>

<script>
'use strict';

/* ==========================================================
   RED DEAD CANVAS
   Вестерн от третьего лица.
   Один файл. Никаких внешних ресурсов.
   Работает на клавиатуре, мыши и сенсорных экранах (iPad).
   ========================================================== */

/* ---------- ХОЛСТ ---------- */
const холст = document.getElementById('игра');
const ctx = холст.getContext('2d');
let Ш = 0, В = 0, ТЧ = 1; // ширина, высота, точка-частота (плотность пикселей)

function обновитьРазмер(){
  ТЧ = Math.min(window.devicePixelRatio || 1, 2);
  Ш = window.innerWidth;
  В = window.innerHeight;
  холст.width  = Math.floor(Ш * ТЧ);
  холст.height = Math.floor(В * ТЧ);
  холст.style.width  = Ш + 'px';
  холст.style.height = В + 'px';
}

window.addEventListener('resize', обновитьРазмер);
window.addEventListener('orientationchange', () => setTimeout(обновитьРазмер, 120));
обновитьРазмер();

/* ---------- ОПРЕДЕЛЕНИЕ ТАЧ-УСТРОЙСТВА ---------- */
const ЭТО_ТАЧ = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

/* ---------- МАТЕМАТИЧЕСКИЕ УТИЛИТЫ ---------- */
const ДВА_ПИ  = Math.PI * 2;
const случ    = (а, б) => а + Math.random() * (б - а);
const огр     = (v, а, б) => v < а ? а : (v > б ? б : v);
const раст    = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

/* Скруглённый прямоугольник */
function скругПрямоуг(c, x, y, w, h, r){
  r = Math.min(r, w * 0.5, h * 0.5);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}

/* ==========================================================
   ЗВУК (WebAudio, без файлов)
   ========================================================== */
let ЗВУК = null, шумовойБуфер = null;

function включитьЗвук(){
  if (ЗВУК) return;
  try{
    ЗВУК = new (window.AudioContext || window.webkitAudioContext)();
    const длина = Math.floor(ЗВУК.sampleRate * 0.5);
    шумовойБуфер = ЗВУК.createBuffer(1, длина, ЗВУК.sampleRate);
    const данные = шумовойБуфер.getChannelData(0);
    for (let i = 0; i < длина; i++) данные[i] = Math.random() * 2 - 1;
  }catch(e){ ЗВУК = null; }
}

/* Звук выстрела */
function звукВыстрел(громкость){
  if (!ЗВУК) return;
  const t = ЗВУК.currentTime;

  const источник = ЗВУК.createBufferSource();
  источник.buffer = шумовойБуфер;
  источник.playbackRate.value = 1.6;

  const фильтр = ЗВУК.createBiquadFilter();
  фильтр.type = 'lowpass';
  фильтр.frequency.setValueAtTime(2400, t);
  фильтр.frequency.exponentialRampToValueAtTime(180, t + 0.13);

  const громк = ЗВУК.createGain();
  громк.gain.setValueAtTime(громкость, t);
  громк.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);

  источник.connect(фильтр); фильтр.connect(громк); громк.connect(ЗВУК.destination);
  источник.start(t); источник.stop(t + 0.22);

  /* Низкий «бум» */
  const осц = ЗВУК.createOscillator();
  осц.type = 'sine';
  осц.frequency.setValueAtTime(190, t);
  осц.frequency.exponentialRampToValueAtTime(45, t + 0.1);
  const ог = ЗВУК.createGain();
  ог.gain.setValueAtTime(громкость * 1.1, t);
  ог.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  осц.connect(ог); ог.connect(ЗВУК.destination);
  осц.start(t); осц.stop(t + 0.18);
}

/* Звук попадания */
function звукПопадание(){
  if (!ЗВУК) return;
  const t = ЗВУК.currentTime;
  const источник = ЗВУК.createBufferSource();
  источник.buffer = шумовойБуфер;
  источник.playbackRate.value = 0.5;
  const фильтр = ЗВУК.createBiquadFilter();
  фильтр.type = 'lowpass'; фильтр.frequency.value = 500;
  const громк = ЗВУК.createGain();
  громк.gain.setValueAtTime(0.25, t);
  громк.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  источник.connect(фильтр); фильтр.connect(громк); громк.connect(ЗВУК.destination);
  источник.start(t); источник.stop(t + 0.3);
}

/* Короткий щелчок */
function звукЩелчок(частота, громкость, длит){
  if (!ЗВУК) return;
  const t = ЗВУК.currentTime;
  const осц = ЗВУК.createOscillator();
  осц.type = 'square';
  осц.frequency.setValueAtTime(частота, t);
  const громк = ЗВУК.createGain();
  громк.gain.setValueAtTime(громкость, t);
  громк.gain.exponentialRampToValueAtTime(0.0001, t + длит);
  осц.connect(громк); громк.connect(ЗВУК.destination);
  осц.start(t); осц.stop(t + длит + 0.02);
}

/* Звук перезарядки */
function звукПерезарядка(){
  звукЩелчок(320, 0.10, 0.06);
  setTimeout(() => звукЩелчок(220, 0.10, 0.07), 160);
}

/* Звук Меткого глаза */
function звукМеткийГлаз(){
  if (!ЗВУК) return;
  const t = ЗВУК.currentTime;
  const осц = ЗВУК.createOscillator();
  осц.type = 'sine';
  осц.frequency.setValueAtTime(900, t);
  осц.frequency.exponentialRampToValueAtTime(180, t + 0.6);
  const громк = ЗВУК.createGain();
  громк.gain.setValueAtTime(0.14, t);
  громк.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
  осц.connect(громк); громк.connect(ЗВУК.destination);
  осц.start(t); осц.stop(t + 0.7);
}

/* Свист коня */
function звукСвист(){
  if (!ЗВУК) return;
  const t = ЗВУК.currentTime;
  const осц = ЗВУК.createOscillator();
  осц.type = 'sine';
  осц.frequency.setValueAtTime(700, t);
  осц.frequency.exponentialRampToValueAtTime(1500, t + 0.12);
  осц.frequency.exponentialRampToValueAtTime(600, t + 0.3);
  const громк = ЗВУК.createGain();
  громк.gain.setValueAtTime(0.10, t);
  громк.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  осц.connect(громк); громк.connect(ЗВУК.destination);
  осц.start(t); осц.stop(t + 0.4);
}

/* ==========================================================
   ВВОД: КЛАВИАТУРА И МЫШЬ
   ========================================================== */
const клавиши = Object.create(null);
const мышь = { x: 0, y: 0, нажата: false, есть: false };

window.addEventListener('keydown', e => {
  клавиши[e.code] = true;

  /* Отменяем прокрутку стрелками и пробелом */
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();

  if (e.code === 'KeyQ') переключитьМеткийГлаз();
  if (e.code === 'KeyE') переключитьКоня();
  if (e.code === 'KeyR'){
    if (состояние === 'конец') начатьИгру();
    else начатьПерезарядку();
  }
  if (e.code === 'Space' && состояние === 'меню') начатьИгру();
});

window.addEventListener('keyup', e => { клавиши[e.code] = false; });

холст.addEventListener('mousemove', e => {
  мышь.x = e.clientX;
  мышь.y = e.clientY;
  мышь.есть = true;
});

холст.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  включитьЗвук();
  if (ЗВУК && ЗВУК.state === 'suspended') ЗВУК.resume();
  if (состояние === 'меню' || состояние === 'конец'){ начатьИгру(); return; }
  мышь.нажата = true;
});

window.addEventListener('mouseup', e => { if (e.button === 0) мышь.нажата = false; });
холст.addEventListener('contextmenu', e => e.preventDefault());

/* ==========================================================
   ВВОД: СЕНСОРНЫЙ ЭКРАН (iPad)
   ========================================================== */

/* Левый стик — движение, правый стик — прицел и авто-огонь */
const стикДвижение = { активен: false, id: null, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0 };
const стикПрицел   = { активен: false, id: null, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0 };

const РАДИУС_СТИКА = 68;    // максимальный радиус хода
const МЁРТВАЯ_ЗОНА = 0.16;  // мёртвая зона

/* Кнопки действий справа */
const кнопкиДействий = [
  { ключ: 'перезарядка', метка: 'ПЕР',  x: () => Ш - 58, y: () => 232, r: 30, цвет: '#c9a03a', нажата: false, tid: null },
  { ключ: 'меткийГлаз',  метка: 'ГЛАЗ', x: () => Ш - 58, y: () => 308, r: 30, цвет: '#d8a83a', нажата: false, tid: null },
  { ключ: 'конь',        метка: 'КОНЬ', x: () => Ш - 58, y: () => 384, r: 30, цвет: '#8a5a30', нажата: false, tid: null }
];

function попаданиеВКнопку(x, y){
  for (const к of кнопкиДействий){
    if (раст(x, y, к.x(), к.y()) < к.r + 16) return к;
  }
  return null;
}

function нажатьКнопку(к){
  if (к.ключ === 'перезарядка') начатьПерезарядку();
  if (к.ключ === 'меткийГлаз')  переключитьМеткийГлаз();
  if (к.ключ === 'конь')        переключитьКоня();
}

function обработатьКосStart(e){
  for (let i = 0; i < e.changedTouches.length; i++){
    const t = e.changedTouches[i];
    const x = t.clientX, y = t.clientY;

    /* Кнопки действий — в приоритете */
    const к = попаданиеВКнопку(x, y);
    if (к){
      к.нажата = true;
      к.tid = t.identifier;
      нажатьКнопку(к);
      continue;
    }

    /* Левая половина — движение */
    if (x < Ш * 0.5 && !стикДвижение.активен){
      стикДвижение.активен = true;
      стикДвижение.id = t.identifier;
      стикДвижение.ox = x; стикДвижение.oy = y;
      стикДвижение.x  = x; стикДвижение.y  = y;
      стикДвижение.dx = 0; стикДвижение.dy = 0;
      continue;
    }

    /* Правая половина — прицел + огонь */
    if (x >= Ш * 0.5 && !стикПрицел.активен){
      стикПрицел.активен = true;
      стикПрицел.id = t.identifier;
      стикПрицел.ox = x; стикПрицел.oy = y;
      стикПрицел.x  = x; стикПрицел.y  = y;
      стикПрицел.dx = 0; стикПрицел.dy = 0;
      continue;
    }
  }
}

function обработатьКосMove(e){
  for (let i = 0; i < e.changedTouches.length; i++){
    const t = e.changedTouches[i];
    const x = t.clientX, y = t.clientY;

    /* Левый стик */
    if (стикДвижение.активен && t.identifier === стикДвижение.id){
      стикДвижение.x = x; стикДвижение.y = y;
      let dx = x - стикДвижение.ox;
      let dy = y - стикДвижение.oy;
      const длина = Math.hypot(dx, dy);
      const макс = РАДИУС_СТИКА;
      if (длина > макс){
        dx = dx / длина * макс;
        dy = dy / длина * макс;
        стикДвижение.ox = x - dx;
        стикДвижение.oy = y - dy;
      }
      стикДвижение.dx = dx / макс;
      стикДвижение.dy = dy / макс;
      if (Math.hypot(стикДвижение.dx, стикДвижение.dy) < МЁРТВАЯ_ЗОНА){
        стикДвижение.dx = 0; стикДвижение.dy = 0;
      }
    }

    /* Правый стик */
    if (стикПрицел.активен && t.identifier === стикПрицел.id){
      стикПрицел.x = x; стикПрицел.y = y;
      let dx = x - стикПрицел.ox;
      let dy = y - стикПрицел.oy;
      const длина = Math.hypot(dx, dy);
      const макс = РАДИУС_СТИКА;
      if (длина > макс){
        dx = dx / длина * макс;
        dy = dy / длина * макс;
        стикПрицел.ox = x - dx;
        стикПрицел.oy = y - dy;
      }
      стикПрицел.dx = dx / макс;
      стикПрицел.dy = dy / макс;
      if (Math.hypot(стикПрицел.dx, стикПрицел.dy) < МЁРТВАЯ_ЗОНА){
        стикПрицел.dx = 0; стикПрицел.dy = 0;
      }
    }
  }
}

function обработатьКосEnd(e){
  for (let i = 0; i < e.changedTouches.length; i++){
    const t = e.changedTouches[i];

    for (const к of кнопкиДействий){
      if (к.tid === t.identifier){
        к.нажата = false;
        к.tid = null;
      }
    }

    if (стикДвижение.активен && t.identifier === стикДвижение.id){
      стикДвижение.активен = false;
      стикДвижение.id = null;
      стикДвижение.dx = 0; стикДвижение.dy = 0;
    }

    if (стикПрицел.активен && t.identifier === стикПрицел.id){
      стикПрицел.активен = false;
      стикПрицел.id = null;
      стикПрицел.dx = 0; стикПрицел.dy = 0;
    }
  }
}

холст.addEventListener('touchstart', e => {
  e.preventDefault();
  включитьЗвук();
  if (ЗВУК && ЗВУК.state === 'suspended') ЗВУК.resume();

  if (состояние === 'меню' || состояние === 'конец'){
    начатьИгру();
    return;
  }
  обработатьКосStart(e);
}, { passive: false });

холст.addEventListener('touchmove', e => {
  e.preventDefault();
  обработатьКосMove(e);
}, { passive: false });

холст.addEventListener('touchend', e => {
  e.preventDefault();
  обработатьКосEnd(e);
}, { passive: false });

холст.addEventListener('touchcancel', e => {
  e.preventDefault();
  обработатьКосEnd(e);
}, { passive: false });

/* ==========================================================
   МИР
   ========================================================== */
const МИР = { ш: 4200, в: 4200 };
const ЦЕНТР_X = 2100, ЦЕНТР_Y = 2100;

let дома      = [];
let объекты   = [];
let крапинки  = [];
let пятна     = [];
let текстураЗемли = null;

const камера = { x: 0, y: 0 };

/* ---------- Текстура земли ---------- */
function построитьТекстуруЗемли(){
  const п = document.createElement('canvas');
  п.width = п.height = 160;
  const pc = п.getContext('2d');

  /* Основа */
  pc.fillStyle = '#cf9f5e';
  pc.fillRect(0, 0, 160, 160);

  /* Крупные пятна */
  for (let i = 0; i < 18; i++){
    const x = Math.random() * 160, y = Math.random() * 160;
    const r = 12 + Math.random() * 30;
    const г = pc.createRadialGradient(x, y, 1, x, y, r);
    г.addColorStop(0, 'rgba(140,100,55,0.16)');
    г.addColorStop(1, 'rgba(140,100,55,0)');
    pc.fillStyle = г;
    pc.beginPath(); pc.arc(x, y, r, 0, ДВА_ПИ); pc.fill();
  }

  /* Мелкие крупинки */
  for (let i = 0; i < 700; i++){
    const v = Math.random();
    if (v < 0.5) pc.fillStyle = 'rgba(110,75,35,' + (0.08 + Math.random() * 0.22) + ')';
    else if (v < 0.85) pc.fillStyle = 'rgba(180,140,80,' + (0.06 + Math.random() * 0.18) + ')';
    else pc.fillStyle = 'rgba(80,55,25,' + (0.06 + Math.random() * 0.2) + ')';
    const s = 0.8 + Math.random() * 2;
    pc.fillRect(Math.random() * 160, Math.random() * 160, s, s);
  }

  /* Трещинки */
  for (let i = 0; i < 9; i++){
    pc.strokeStyle = 'rgba(90,60,30,' + (0.08 + Math.random() * 0.14) + ')';
    pc.lineWidth = 0.6 + Math.random() * 1.2;
    pc.beginPath();
    let x = Math.random() * 160, y = Math.random() * 160;
    pc.moveTo(x, y);
    for (let j = 0; j < 6; j++){
      x += (Math.random() - 0.5) * 26;
      y += (Math.random() - 0.5) * 26;
      pc.lineTo(x, y);
    }
    pc.stroke();
  }

  /* Травинки */
  for (let i = 0; i < 40; i++){
    const x = Math.random() * 160, y = Math.random() * 160;
    pc.strokeStyle = 'rgba(110,120,55,' + (0.12 + Math.random() * 0.22) + ')';
    pc.lineWidth = 1;
    pc.beginPath();
    pc.moveTo(x, y);
    pc.lineTo(x + (Math.random() - 0.5) * 4, y - 2 - Math.random() * 3);
    pc.stroke();
  }

  текстураЗемли = ctx.createPattern(п, 'repeat');
}

/* ---------- Генерация мира ---------- */
function построитьМир(){
  дома     = [];
  объекты  = [];
  крапинки = [];
  пятна    = [];

  /* --- Два ряда домов вдоль главной улицы --- */
  const колонки = [ЦЕНТР_X - 960, ЦЕНТР_X - 640, ЦЕНТР_X - 320, ЦЕНТР_X, ЦЕНТР_X + 320, ЦЕНТР_X + 640];
  const верх    = ['#7c5233', '#6d4a2e', '#8a5c3a', '#6b4327', '#7a4f30', '#86583a'];
  const низ     = ['#6b4327', '#7a4f30', '#6d4a2e', '#86583a', '#7c5233', '#8a5c3a'];

  for (let i = 0; i < колонки.length; i++){
    дома.push({ x: колонки[i], y: ЦЕНТР_Y - 460, w: 280, h: 220, c: верх[i], дверь: 'вниз' });
    дома.push({ x: колонки[i], y: ЦЕНТР_Y + 240, w: 280, h: 220, c: низ[i],  дверь: 'вверх' });
  }

  /* Салон в центре */
  дома.push({ x: ЦЕНТР_X - 150, y: ЦЕНТР_Y - 130, w: 300, h: 260, c: '#8f5d33', дверь: 'нет', салун: true });

  /* Дальние постройки */
  const дальние = [
    { x: ЦЕНТР_X - 1500, y: ЦЕНТР_Y - 1100, w: 240, h: 180, c: '#6d4a2e', дверь: 'вниз' },
    { x: ЦЕНТР_X + 1200, y: ЦЕНТР_Y +  900, w: 220, h: 170, c: '#7a4f30', дверь: 'вверх' },
    { x: ЦЕНТР_X - 1250, y: ЦЕНТР_Y + 1250, w: 260, h: 190, c: '#7c5233', дверь: 'вверх' },
    { x: ЦЕНТР_X + 1450, y: ЦЕНТР_Y -  950, w: 200, h: 160, c: '#6b4327', дверь: 'вниз' }
  ];
  for (const д of дальние) дома.push(д);

  /* --- Пустынные объекты --- */
  const вГороде = (x, y) =>
    x > ЦЕНТР_X - 1200 && x < ЦЕНТР_X + 1150 && y > ЦЕНТР_Y - 750 && y < ЦЕНТР_Y + 750;

  for (let i = 0; i < 560; i++){
    const x = случ(60, МИР.ш - 60);
    const y = случ(60, МИР.в - 60);
    if (вГороде(x, y)) continue;
    if (сталкиваетсяСДомами(x, y, 40)) continue;

    const r = Math.random();
    const тип = r < 0.42 ? 'кактус' : (r < 0.74 ? 'камень' : 'дерево');
    объекты.push({ x, y, тип, s: случ(0.75, 1.5), поворот: случ(0, ДВА_ПИ), seed: Math.random() });
  }

  /* Бочки возле домов */
  for (let i = 0; i < 34; i++){
    const x = ЦЕНТР_X + случ(-1150, 1100);
    const y = ЦЕНТР_Y + (Math.random() < 0.5 ? -200 : 200) + случ(-24, 24);
    if (сталкиваетсяСДомами(x, y, 24)) continue;
    объекты.push({ x, y, тип: 'бочка', s: 1, поворот: 0, seed: Math.random() });
  }

  /* --- Декоративные крапинки и пятна --- */
  for (let i = 0; i < 2400; i++){
    крапинки.push({
      x: случ(0, МИР.ш), y: случ(0, МИР.в),
      r: случ(0.8, 2.6), a: случ(0.04, 0.16)
    });
  }
  for (let i = 0; i < 160; i++){
    пятна.push({
      x: случ(0, МИР.ш), y: случ(0, МИР.в),
      r: случ(70, 220), a: случ(0.015, 0.07)
    });
  }
}

/* ---------- Коллизии ---------- */
function сталкиваетсяСДомами(x, y, r){
  for (const д of дома){
    const cx = огр(x, д.x, д.x + д.w);
    const cy = огр(y, д.y, д.y + д.h);
    const dx = x - cx, dy = y - cy;
    if (dx*dx + dy*dy < r*r) return д;
  }
  return null;
}

function вытолкнутьИзДомов(сущ){
  for (const д of дома){
    const cx = огр(сущ.x, д.x, д.x + д.w);
    const cy = огр(сущ.y, д.y, д.y + д.h);
    const dx = сущ.x - cx;
    const dy = сущ.y - cy;
    const d2 = dx*dx + dy*dy;

    if (d2 < сущ.r * сущ.r){
      const d = Math.sqrt(d2);
      if (d < 0.0001){
        const слева  = сущ.x - д.x;
        const справа = д.x + д.w - сущ.x;
        const сверху = сущ.y - д.y;
        const снизу  = д.y + д.h - сущ.y;
        const м = Math.min(слева, справа, сверху, снизу);
        if      (м === слева)  сущ.x = д.x - сущ.r;
        else if (м === справа) сущ.x = д.x + д.w + сущ.r;
        else if (м === сверху) сущ.y = д.y - сущ.r;
        else                   сущ.y = д.y + д.h + сущ.r;
      } else {
        const выт = (сущ.r - d) / d;
        сущ.x += dx * выт;
        сущ.y += dy * выт;
      }
    }
  }
  сущ.x = огр(сущ.x, сущ.r, МИР.ш - сущ.r);
  сущ.y = огр(сущ.y, сущ.r, МИР.в - сущ.r);
}

/* Отрезок vs прямоугольник (Liang-Barsky) */
function отрезокПрямоуг(x1, y1, x2, y2, r){
  const dx = x2 - x1, dy = y2 - y1;
  let t0 = 0, t1 = 1;
  const p = [-dx, dx, -dy, dy];
  const q = [x1 - r.x, r.x + r.w - x1, y1 - r.y, r.y + r.h - y1];

  for (let i = 0; i < 4; i++){
    if (p[i] === 0){
      if (q[i] < 0) return false;
    } else {
      const t = q[i] / p[i];
      if (p[i] < 0){ if (t > t1) return false; if (t > t0) t0 = t; }
      else         { if (t < t0) return false; if (t < t1) t1 = t; }
    }
  }
  return true;
}

/* Отрезок vs круг */
function отрезокКруг(x1, y1, x2, y2, cx, cy, r){
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx*dx + dy*dy;
  let t = l2 ? ((cx - x1) * dx + (cy - y1) * dy) / l2 : 0;
  t = огр(t, 0, 1);
  const px = x1 + dx * t, py = y1 + dy * t;
  return (px - cx) * (px - cx) + (py - cy) * (py - cy) <= r * r;
}

/* Прямая видимость — нет препятствий */
function естьПрямаяВидимость(x1, y1, x2, y2){
  for (const д of дома) if (отрезокПрямоуг(x1, y1, x2, y2, д)) return false;
  return true;
}

function начатьИгру(){

  игрок.патроны = 12;
  игрок.запас = 72;
  игрок.откатВыстрела = 0;
  игрок.перезарядка = 0;

function конецИгры(){

      x: игрок.x, y: игрок.y,

    });

  звукПопадание();
}

/* ==========================================================
   КАМЕРА ОТ ТРЕТЬЕГО ЛИЦА
   ========================================================== */
const СМЕЩЕНИЕ_ВПЕРЁД = 150;

function обновитьКамеру(мгновенно){
  const смотрX = игрок.x + Math.cos(игрок.угол) * СМЕЩЕНИЕ_ВПЕРЁД;
  const смотрY = игрок.y + Math.sin(игрок.угол) * СМЕЩЕНИЕ_ВПЕРЁД;

  let tx = смотрX - Ш / 2;
  let ty = смотрY - В / 2;

  tx = огр(tx, 0, Math.max(0, МИР.ш - Ш));
  ty = огр(ty, 0, Math.max(0, МИР.в - В));
  if (МИР.ш < Ш) tx = (МИР.ш - Ш) / 2;
  if (МИР.в < В) ty = (МИР.в - В) / 2;

  if (мгновенно){
    камера.x = tx; камера.y = ty;
  } else {
    камера.x += (tx - камера.x) * 0.14;
    камера.y += (ty - камера.y) * 0.14;
  }
}

/* ==========================================================
   ИГРОК
   ========================================================== */
function ближайшийВраг(x, y, максD){
  let лучший = null, лучD = максD;
  for (const в of враги){
    const d = раст(x, y, в.x, в.y);
    if (d < лучD){ лучD = d; лучший = в; }
  }
  return лучший;
}

function переключитьМеткийГлаз(){
  if (состояние !== 'игра') return;
  if (игрок.мгАктивен){ игрок.мгАктивен = false; return; }
  if (игрок.меткийГлаз > 0.15){
    игрок.мгАктивен = true;
    звукМеткийГлаз();
  }
}

function начатьПерезарядку(){
  if (состояние !== 'игра') return;
  if (игрок.перезарядка > 0) return;
  if (игрок.патроны >= игрок.максПатронов) return;
  if (игрок.запас <= 0) return;
  игрок.перезарядка = 1.35;
  звукПерезарядка();
}

function выстрел(){
  if (игрок.перезарядка > 0) return;
  if (игрок.патроны <= 0){ начатьПерезарядку(); return; }

  игрок.патроны--;
  игрок.откатВыстрела = игрок.мгАктивен ? 0.11 : 0.17;

  const разброс = игрок.мгАктивен ? 0 : 0.05;
  const a = игрок.угол + случ(-разброс, разброс);

  const bx = игрок.x + Math.cos(игрок.угол) * 26;
  const by = игрок.y + Math.sin(игрок.угол) * 26;

  пули.push({
    x: bx, y: by, px: bx, py: by,
    vx: Math.cos(a) * 1500, vy: Math.sin(a) * 1500,
    жизнь: 1.4, дружеская: true, урон: 35
  });

  /* Вспышка */
  for (let i = 0; i < 7; i++){
    const ang = a + случ(-0.5, 0.5), sp = случ(80, 420);
    частицы.push({
      x: bx, y: by,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      жизнь: случ(0.05, 0.18), макс: 0.18,
      цвет: i % 2 ? '#fff0a8' : '#ffb43a',
      размер: случ(2, 5), гравитация: 0
    });
  }

  /* Гильза */
  частицы.push({
    x: bx, y: by,
    vx: Math.cos(a + 2.2) * 160, vy: Math.sin(a + 2.2) * 160,
    жизнь: 0.8, макс: 0.8, цвет: '#d9b23a', размер: 2.4, гравитация: 0
  });

  тряска = Math.min(тряска + 4, 10);
  звукВыстрел(0.16);
}

function переключитьКоня(){
  if (состояние !== 'игра') return;

  if (игрок.верхом){
    игрок.верхом = false;
    const a = игрок.угол + Math.PI / 2;
    конь.x = игрок.x + Math.cos(a) * 52;
    конь.y = игрок.y + Math.sin(a) * 52;
    вытолкнутьИзДомов(конь);
  } else if (конь && раст(конь.x, конь.y, игрок.x, игрок.y) < 100){
    игрок.верхом = true;
    игрок.x = конь.x;
    игрок.y = конь.y;
    звукСвист();
  }
}

function обновитьИгрока(dt){
  if (игрок.хп <= 0) return;

  /* --- Ввод: движение --- */
  let ix = 0, iy = 0;

  if (клавиши.KeyW || клавиши.ArrowUp)    iy--;
  if (клавиши.KeyS || клавиши.ArrowDown)  iy++;
  if (клавиши.KeyA || клавиши.ArrowLeft)  ix--;
  if (клавиши.KeyD || клавиши.ArrowRight) ix++;

  if (стикДвижение.активен && (стикДвижение.dx || стикДвижение.dy)){
    ix += стикДвижение.dx;
    iy += стикДвижение.dy;
  }

  const длина = Math.hypot(ix, iy);
  игрок.движется = длина > 0.01;

  let скорость = игрок.верхом ? 340 : 200;
  if ((клавиши.ShiftLeft || клавиши.ShiftRight) && !игрок.верхом) скорость *= 1.45;

  if (длина > 0){
    ix /= длина; iy /= длина;
    игрок.x += ix * скорость * dt;
    игрок.y += iy * скорость * dt;
    игрок.фазаШага += dt * (игрок.верхом ? 14 : 11);
  } else {
    игрок.фазаШага *= Math.pow(0.02, dt);
  }

  вытолкнутьИзДомов(игрок);

  /* --- Ввод: прицел --- */
  let уголПрицела = игрок.угол;
  let хочуСтрелять = false;

  if (стикПрицел.активен && (стикПрицел.dx || стикПрицел.dy)){
    уголПрицела = Math.atan2(стикПрицел.dy, стикПрицел.dx);
    хочуСтрелять = true;
  } else if (мышь.есть && !ЭТО_ТАЧ){
    const mx = мышь.x + камера.x;
    const my = мышь.y + камера.y;
    уголПрицела = Math.atan2(my - игрок.y, mx - игрок.x);
    хочуСтрелять = мышь.нажата;
  }

  /* Меткий глаз — прицел на ближайшего врага */
  if (игрок.мгАктивен){
    const ц = ближайшийВраг(игрок.x, игрок.y, 950);
    if (ц) уголПрицела = Math.atan2(ц.y - игрок.y, ц.x - игрок.x);
  }

  /* Плавный поворот */
  let разница = уголПрицела - игрок.угол;
  while (разница >  Math.PI) разница -= ДВА_ПИ;
  while (разница < -Math.PI) разница += ДВА_ПИ;
  игрок.угол += разница * Math.min(1, dt * 24);

  /* --- Перезарядка --- */
  if (игрок.перезарядка > 0){
    игрок.перезарядка -= dt;
    if (игрок.перезарядка <= 0){
      игрок.перезарядка = 0;
      const нужно = игрок.максПатронов - игрок.патроны;
      const взять = Math.min(нужно, игрок.запас);
      игрок.патроны += взять;
      игрок.запас -= взять;
    }
  }

  if (игрок.откатВыстрела > 0) игрок.откатВыстрела -= dt;
  if (игрок.урон > 0)          игрок.урон -= dt;

  /* --- Огонь --- */
  if (хочуСтрелять && игрок.откатВыстрела <= 0 && игрок.перезарядка <= 0){
    выстрел();
  }

  /* --- Расход Меткого глаза --- */
  if (игрок.мгАктивен){
    игрок.меткийГлаз -= dt * 0.30;
    if (игрок.меткийГлаз <= 0){
      игрок.меткийГлаз = 0;
      игрок.мгАктивен = false;
    }
  } else if (игрок.меткийГлаз < 1){
    игрок.меткийГлаз = Math.min(1, игрок.меткийГлаз + dt * 0.035);
  }

  /* --- Конь --- */
  if (игрок.верхом){
    конь.x = игрок.x;
    конь.y = игрок.y;
    конь.угол = игрок.угол;
    if (длина > 0) конь.фазаШага += dt * 16;
  } else if (конь){
    const d = раст(конь.x, конь.y, игрок.x, игрок.y);
    if (d > 300){
      const a = Math.atan2(игрок.y - конь.y, игрок.x - конь.x);
      конь.x += Math.cos(a) * 95 * dt;
      конь.y += Math.sin(a) * 95 * dt;
      конь.угол = a;
      конь.фазаШага += dt * 9;
      вытолкнутьИзДомов(конь);
    }
  }
}

/* ==========================================================
   ВРАГИ
   ========================================================== */
function создатьВрага(){
  for (let i = 0; i < 50; i++){
    const a = Math.random() * ДВА_ПИ;
    const d = случ(820, 1350);
    const x = огр(игрок.x + Math.cos(a) * d, 60, МИР.ш - 60);
    const y = огр(игрок.y + Math.sin(a) * d, 60, МИР.в - 60);

    if (сталкиваетсяСДомами(x, y, 30)) continue;

    враги.push({
      x, y, r: 14,
      хп: 70, максХп: 70,
      угол: 0,
      скорость: случ(100, 130) + Math.min(65, время * 0.55),
      откатВыстрела: случ(0.6, 2.2),
      бокНаправление: Math.random() < 0.5 ? -1 : 1,
      бокТаймер: случ(0.4, 1.6),
      урон: 0,
      вспышка: 0,
      фазаШага: Math.random() * 10
    });
    return;
  }
}

function убитьВрага(в){
  const i = враги.indexOf(в);
  if (i >= 0) враги.splice(i, 1);

  счёт += 100;
  убийств++;

  for (let k = 0; k < 18; k++){
    const a = Math.random() * ДВА_ПИ, sp = случ(40, 280);
    частицы.push({
      x: в.x, y: в.y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      жизнь: случ(0.3, 0.8), макс: 0.8,
      цвет: k % 3 ? '#a3151a' : '#6d0f12',
      размер: случ(2, 4.5), гравитация: 0
    });
  }
  звукПопадание();
}

function обновитьВрагов(dt){
  for (const в of враги){
    if (в.урон > 0) в.урон -= dt;
    if (в.вспышка > 0) в.вспышка -= dt;

    const d = раст(в.x, в.y, игрок.x, игрок.y);
    const анг = Math.atan2(игрок.y - в.y, игрок.x - в.x);

    в.бокТаймер -= dt;
    if (в.бокТаймер <= 0){
      в.бокТаймер = случ(0.6, 1.8);
      в.бокНаправление = Math.random() < 0.5 ? -1 : 1;
    }

    let mx = 0, my = 0;
    if (d > 350){ mx += Math.cos(анг); my += Math.sin(анг); }
    else if (d < 210){ mx -= Math.cos(анг) * 0.7; my -= Math.sin(анг) * 0.7; }
    mx += -Math.sin(анг) * в.бокНаправление * 0.75;
    my +=  Math.cos(анг) * в.бокНаправление * 0.75;

    const дл = Math.hypot(mx, my) || 1;
    в.x += (mx / дл) * в.скорость * dt;
    в.y += (my / дл) * в.скорость * dt;
    в.фазаШага += dt * 10;

    вытолкнутьИзДомов(в);

    let разница = анг - в.угол;
    while (разница >  Math.PI) разница -= ДВА_ПИ;
    while (разница < -Math.PI) разница += ДВА_ПИ;
    в.угол += разница * Math.min(1, dt * 8);

    в.откатВыстрела -= dt;
    if (d < 760 && в.откатВыстрела <= 0 && естьПрямаяВидимость(в.x, в.y, игрок.x, игрок.y)){
      в.откатВыстрела = случ(1.1, 2.3);

      const a = анг + случ(-0.12, 0.12);
      пули.push({
        x: в.x + Math.cos(a) * 20,
        y: в.y + Math.sin(a) * 20,
        px: в.x + Math.cos(a) * 20,
        py: в.y + Math.sin(a) * 20,
        vx: Math.cos(a) * 640,
        vy: Math.sin(a) * 640,
        жизнь: 1.6, дружеская: false, урон: 8
      });

      в.вспышка = 0.07;
      звукВыстрел(0.055);
    }
  }
}

/* ==========================================================
   ПУЛИ И ЧАСТИЦЫ
   ========================================================== */
function обновитьПули(dt){
  for (let i = пули.length - 1; i >= 0; i--){
    const п = пули[i];

    п.px = п.x; п.py = п.y;
    п.x += п.vx * dt;
    п.y += п.vy * dt;
    п.жизнь -= dt;

    let мёртв = п.жизнь <= 0 || п.x < 0 || п.y < 0 || п.x > МИР.ш || п.y > МИР.в;

    /* Столкновение с домами */
    if (!мёртв){
      for (const д of дома){
        if (отрезокПрямоуг(п.px, п.py, п.x, п.y, д)){
          мёртв = true;
          for (let k = 0; k < 5; k++){
            const a = Math.atan2(-п.vy, -п.vx) + случ(-1, 1), sp = случ(30, 180);
            частицы.push({
              x: п.x, y: п.y,
              vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
              жизнь: случ(0.1, 0.35), макс: 0.35,
              цвет: '#c9b08a', размер: случ(1.5, 3), гравитация: 0
            });
          }
          break;
        }
      }
    }

    /* Попадание в цели */
    if (!мёртв){
      if (п.дружеская){
        for (const в of враги){
          if (отрезокКруг(п.px, п.py, п.x, п.y, в.x, в.y, в.r + 4)){
            в.хп -= п.урон;
            в.урон = 0.15;
            кровь(в.x, в.y, п.vx, п.vy);
            мёртв = true;
            if (в.хп <= 0) убитьВрага(в);
            break;
          }
        }
      } else {
        if (отрезокКруг(п.px, п.py, п.x, п.y, игрок.x, игрок.y, игрок.r + 4)){
          ранитьИгрока(п.урон);
          кровь(игрок.x, игрок.y, п.vx, п.vy);
          мёртв = true;
        }
      }
    }

    if (мёртв) пули.splice(i, 1);
  }
}

function кровь(x, y, vx, vy){
  const a0 = Math.atan2(vy, vx);
  for (let i = 0; i < 10; i++){
    const a = a0 + случ(-0.9, 0.9), sp = случ(50, 280);
    частицы.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      жизнь: случ(0.25, 0.6), макс: 0.6,
      цвет: '#a3151a', размер: случ(1.5, 3.5), гравитация: 0
    });
  }
}

function ранитьИгрока(урон){
  if (игрок.хп <= 0) return;
  игрок.хп -= урон;
  игрок.урон = 0.3;
  тряска = Math.min(тряска + 5, 14);
  вспышкаУрона = 0.25;
  звукПопадание();
  if (игрок.хп <= 0){
    игрок.хп = 0;
    конецИгры();
  }
}

function обновитьЧастицы(dt){
  for (let i = частицы.length - 1; i >= 0; i--){
    const ч = частицы[i];
    ч.жизнь -= dt;
    if (ч.жизнь <= 0){ частицы.splice(i, 1); continue; }
    ч.x += ч.vx * dt;
    ч.y += ч.vy * dt;
    const к = Math.exp(-6 * dt);
    ч.vx *= к;
    ч.vy *= к;
    ч.vy += (ч.гравитация || 0) * dt;
  }
}

/* ==========================================================
   ОБНОВЛЕНИЕ
   ========================================================== */
function обновить(dt){
  if (тряска > 0) тряска = Math.max(0, тряска - dt * 26);
  if (вспышкаУрона > 0) вспышкаУрона -= dt;
  if (таймерПодсказки > 0) таймерПодсказки -= dt;

  if (состояние !== 'игра'){
    обновитьЧастицы(dt);
    обновитьКамеру(false);
    return;
  }

  время += dt;

  const зам = игрок.мгАктивен ? 0.35 : 1;

  обновитьИгрока(dt * (игрок.мгАктивен ? 0.6 : 1));
  обновитьКамеру(false);

  обновитьВрагов(dt * зам);
  обновитьПули(dt * зам);
  обновитьЧастицы(dt);

  таймерСпавна -= dt;
  if (таймерСпавна <= 0){
    const максВрагов = 4 + Math.min(15, Math.floor(время / 22));
    if (враги.length < максВрагов) создатьВрага();
    таймерСпавна = случ(0.7, 2.0);
  }
}

/* ---------- ЗЕМЛЯ ---------- */
function нарисоватьЗемлю(){
  const x0 = камера.x, y0 = камера.y, x1 = камера.x + Ш, y1 = камера.y + В;

  /* Базовый паттерн */
  if (текстураЗемли){
    ctx.fillStyle = текстураЗемли;
    ctx.fillRect(x0 - 100, y0 - 100, Ш + 200, В + 200);
  } else {
    ctx.fillStyle = '#cf9f5e';
    ctx.fillRect(x0 - 100, y0 - 100, Ш + 200, В + 200);
  }

  /* Крупные пятна */
  for (const п of пятна){
    if (п.x + п.r < x0 || п.x - п.r > x1 || п.y + п.r < y0 || п.y - п.r > y1) continue;
    ctx.globalAlpha = п.a;
    ctx.fillStyle = '#8a6435';
    ctx.beginPath();
    ctx.arc(п.x, п.y, п.r, 0, ДВА_ПИ);
    ctx.fill();
  }

  /* Крупинки */
  for (const к of крапинки){
    if (к.x < x0 || к.x > x1 || к.y < y0 || к.y > y1) continue;
    ctx.globalAlpha = к.a;
    ctx.fillStyle = '#6b4a24';
    ctx.fillRect(к.x, к.y, к.r, к.r);
  }
  ctx.globalAlpha = 1;

  /* Главная улица */
  ctx.fillStyle = '#b98a52';
  ctx.fillRect(ЦЕНТР_X - 1340, ЦЕНТР_Y - 240, 2680, 480);

  /* Края улицы */
  ctx.fillStyle = 'rgba(120,85,45,0.32)';
  ctx.fillRect(ЦЕНТР_X - 1340, ЦЕНТР_Y - 240, 2680, 22);
  ctx.fillRect(ЦЕНТР_X - 1340, ЦЕНТР_Y + 218, 2680, 22);

  /* Колеи */
  ctx.fillStyle = 'rgba(120,85,45,0.20)';
  ctx.fillRect(ЦЕНТР_X - 1340, ЦЕНТР_Y - 62, 2680, 14);
  ctx.fillRect(ЦЕНТР_X - 1340, ЦЕНТР_Y + 48, 2680, 14);

  /* Доски поперёк */
  ctx.fillStyle = 'rgba(90,60,30,0.10)';
  for (let x = ЦЕНТР_X - 1340; x < ЦЕНТР_X + 1340; x += 120){
    ctx.fillRect(x, ЦЕНТР_Y - 240, 4, 480);
  }
}

/* ---------- ПУСТЫННЫЕ ОБЪЕКТЫ ---------- */
function нарисоватьОбъекты(){
  const x0 = камера.x - 100, y0 = камера.y - 100, x1 = камера.x + Ш + 100, y1 = камера.y + В + 100;

  for (const п of объекты){
    if (п.x < x0 || п.x > x1 || п.y < y0 || п.y > y1) continue;

    ctx.save();
    ctx.translate(п.x, п.y);

    /* Тень */
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(6, 8, 18 * п.s, 10 * п.s, 0, 0, ДВА_ПИ);
    ctx.fill();

    ctx.scale(п.s, п.s);

    if (п.тип === 'кактус'){
      ctx.fillStyle = '#4a7a3a';
      ctx.strokeStyle = '#2f5226';
      ctx.lineWidth = 2;

      ctx.beginPath(); ctx.ellipse(-14, -10, 7, 6, 0.4, 0, ДВА_ПИ); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse( 14, -13, 6.5, 6, -0.4, 0, ДВА_ПИ); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, 13, 12, 0, 0, ДВА_ПИ); ctx.fill(); ctx.stroke();

      ctx.strokeStyle = 'rgba(200,230,160,0.5)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 8; i++){
        const a = (i / 8) * ДВА_ПИ + п.seed;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 6, Math.sin(a) * 6);
        ctx.lineTo(Math.cos(a) * 12, Math.sin(a) * 12);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath(); ctx.arc(-3, -3, 5, 0, ДВА_ПИ); ctx.fill();

    } else if (п.тип === 'камень'){
      ctx.fillStyle = '#9a9186';
      ctx.strokeStyle = '#6f6862';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, ДВА_ПИ);
      ctx.arc(-8, 5, 8, 0, ДВА_ПИ);
      ctx.arc(8, 4, 7, 0, ДВА_ПИ);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.beginPath(); ctx.arc(-4, -4, 5, 0, ДВА_ПИ); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath(); ctx.arc(4, 5, 4, 0, ДВА_ПИ); ctx.fill();

    } else if (п.тип === 'дерево'){
      ctx.strokeStyle = '#5a4028';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      for (let i = 0; i < 5; i++){
        const a = (i / 5) * ДВА_ПИ + п.поворот;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * 22, Math.sin(a) * 22);
        ctx.stroke();
      }
      ctx.fillStyle = '#6b4c2e';
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, ДВА_ПИ); ctx.fill();
      ctx.strokeStyle = '#4a3320'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(255,220,160,0.12)';
      ctx.beginPath(); ctx.arc(-2, -2, 3, 0, ДВА_ПИ); ctx.fill();

    } else if (п.тип === 'бочка'){
      ctx.fillStyle = '#8a5a30';
      ctx.strokeStyle = '#4a2f18';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, ДВА_ПИ); ctx.fill(); ctx.stroke();

      ctx.strokeStyle = '#3a2410';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, 7, 0, ДВА_ПИ); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, ДВА_ПИ); ctx.stroke();

      ctx.fillStyle = '#a06c3a';
      ctx.beginPath(); ctx.arc(-2, -2, 3, 0, ДВА_ПИ); ctx.fill();

      ctx.fillStyle = 'rgba(255,220,160,0.18)';
      ctx.beginPath(); ctx.arc(-4, -4, 4, 0, ДВА_ПИ); ctx.fill();
    }

    ctx.restore();
  }
}

/* ---------- ДОМА ---------- */
function нарисоватьДома(){
  const x0 = камера.x - 200, y0 = камера.y - 200, x1 = камера.x + Ш + 200, y1 = камера.y + В + 200;

  for (const д of дома){
    if (д.x > x1 || д.x + д.w < x0 || д.y > y1 || д.y + д.h < y0) continue;

    /* Тень */
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(д.x + 10, д.y + 14, д.w, д.h);

    /* Основа */
    ctx.fillStyle = д.c;
    ctx.fillRect(д.x, д.y, д.w, д.h);

    /* Горизонтальные доски */
    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.lineWidth = 2;
    for (let y = д.y + 22; y < д.y + д.h; y += 22){
      ctx.beginPath();
      ctx.moveTo(д.x, y);
      ctx.lineTo(д.x + д.w, y);
      ctx.stroke();
    }

    /* Вертикальные стыки */
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    for (let x = д.x + 34; x < д.x + д.w; x += 60){
      ctx.beginPath();
      ctx.moveTo(x, д.y);
      ctx.lineTo(x, д.y + д.h);
      ctx.stroke();
    }

    /* Конёк крыши */
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(д.x + 10, д.y + д.h / 2);
    ctx.lineTo(д.x + д.w - 10, д.y + д.h / 2);
    ctx.stroke();

    /* Тёмная обводка */
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 3;
    ctx.strokeRect(д.x + 1.5, д.y + 1.5, д.w - 3, д.h - 3);

    /* Светлый край сверху */
    ctx.strokeStyle = 'rgba(255,220,160,0.18)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(д.x + 4, д.y + 4);
    ctx.lineTo(д.x + д.w - 4, д.y + 4);
    ctx.stroke();

    /* Дверь / крыльцо */
    if (д.дверь === 'вниз'){
      ctx.fillStyle = '#3b2517';
      ctx.fillRect(д.x + д.w / 2 - 26, д.y + д.h - 20, 52, 20);
      ctx.fillStyle = 'rgba(255,220,160,0.12)';
      ctx.fillRect(д.x + д.w / 2 - 26, д.y + д.h - 20, 52, 4);
      ctx.fillStyle = '#c9a03a';
      ctx.beginPath();
      ctx.arc(д.x + д.w / 2 + 16, д.y + д.h - 10, 2, 0, ДВА_ПИ);
      ctx.fill();
    } else if (д.дверь === 'вверх'){
      ctx.fillStyle = '#3b2517';
      ctx.fillRect(д.x + д.w / 2 - 26, д.y, 52, 20);
      ctx.fillStyle = 'rgba(255,220,160,0.12)';
      ctx.fillRect(д.x + д.w / 2 - 26, д.y + 16, 52, 4);
      ctx.fillStyle = '#c9a03a';
      ctx.beginPath();
      ctx.arc(д.x + д.w / 2 + 16, д.y + 10, 2, 0, ДВА_ПИ);
      ctx.fill();
    }

    /* Вывеска салуна */
    if (д.салун){
      const sx = д.x + д.w / 2 - 60;
      const sy = д.y + д.h / 2 - 16;
      ctx.fillStyle = '#3a2212';
      скругПрямоуг(ctx, sx, sy, 120, 32, 4);
      ctx.fill();
      ctx.strokeStyle = '#c9a03a';
      ctx.lineWidth = 2;
      скругПрямоуг(ctx, sx, sy, 120, 32, 4);
      ctx.stroke();

      ctx.fillStyle = '#e8c98a';
      ctx.font = 'bold 17px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('SALOON', sx + 60, sy + 17);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }
  }
}

/* ---------- КОВБОЙ (вид сверху, детализированный) ---------- */
function нарисоватьКовбоя(x, y, угол, опции){
  const ЭтоИгрок = опции.этоИгрок;
  const М = опции.масштаб || 1;

  ctx.save();
  ctx.translate(x, y);

  /* Тень */
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath();
  ctx.ellipse(4, 6, 22 * М, 15 * М, 0, 0, ДВА_ПИ);
  ctx.fill();

  ctx.rotate(угол);
  ctx.scale(М, М);

  const фаза = опции.фазаШага || 0;
  const качание = Math.sin(фаза) * 2.2;

  /* === НОГИ === */
  ctx.fillStyle = '#2a1c12';
  ctx.beginPath(); ctx.ellipse(-13, -8 + качание, 6.5, 4.5, 0, 0, ДВА_ПИ); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-13,  8 - качание, 6.5, 4.5, 0, 0, ДВА_ПИ); ctx.fill();

  ctx.fillStyle = '#3a281a';
  ctx.beginPath(); ctx.ellipse(-8, -8 + качание, 3, 2.5, 0, 0, ДВА_ПИ); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-8,  8 - качание, 3, 2.5, 0, 0, ДВА_ПИ); ctx.fill();

  /* === ТЕЛО / ПАЛЬТО === */
  const цветПальто  = ЭтоИгрок ? '#4a3a6b' : '#5c2b22';
  const цветТёмный  = ЭтоИгрок ? '#2f2449' : '#3d1a15';
  const цветЖилета  = ЭтоИгрок ? '#3a2d52' : '#7a3020';

  ctx.fillStyle = цветПальто;
  ctx.beginPath();
  ctx.ellipse(0, 0, 14, 12, 0, 0, ДВА_ПИ);
  ctx.fill();

  /* Затенение */
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(-2, 0, 12, 11, 0, 0, ДВА_ПИ);
  ctx.fill();

  /* Блик */
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.beginPath();
  ctx.ellipse(4, -3, 9, 5, 0, 0, ДВА_ПИ);
  ctx.fill();

  /* === ЖИЛЕТ === */
  ctx.fillStyle = цветЖилета;
  ctx.beginPath();
  ctx.ellipse(0, 0, 9, 8, 0, 0, ДВА_ПИ);
  ctx.fill();

  /* Пуговицы */
  ctx.fillStyle = '#c9a03a';
  for (let i = -1; i <= 1; i++){
    ctx.beginPath();
    ctx.arc(1, i * 3.5, 1.1, 0, ДВА_ПИ);
    ctx.fill();
  }

  /* === РЕМЕНЬ === */
  ctx.strokeStyle = '#2a1a10';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-6, -10);
  ctx.lineTo(-6, 10);
  ctx.stroke();

  ctx.fillStyle = '#c9a03a';
  ctx.beginPath();
  ctx.arc(-6, 0, 2.2, 0, ДВА_ПИ);
  ctx.fill();
  ctx.fillStyle = '#7a5a20';
  ctx.beginPath();
  ctx.arc(-6, 0, 0.9, 0, ДВА_ПИ);
  ctx.fill();

  /* === РУКИ === */
  ctx.fillStyle = цветТёмный;
  ctx.beginPath();
  ctx.ellipse(10, -7, 4.8, 3.6, 0, 0, ДВА_ПИ);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(10, 7, 4.8, 3.6, 0, 0, ДВА_ПИ);
  ctx.fill();

  /* Кисти */
  ctx.fillStyle = '#d9a679';
  ctx.beginPath(); ctx.arc(13, -7, 2.9, 0, ДВА_ПИ); ctx.fill();
  ctx.beginPath(); ctx.arc(13,  7, 2.9, 0, ДВА_ПИ); ctx.fill();

  /* === РЕВОЛЬВЕР === */
  ctx.fillStyle = '#1e1e24';
  ctx.fillRect(13, -3.5, 14, 4);
  ctx.fillStyle = '#2c2c36';
  ctx.fillRect(15, -3, 12, 3);
  ctx.fillStyle = '#3a3a44';
  ctx.beginPath(); ctx.arc(17, -1.5, 2.6, 0, ДВА_ПИ); ctx.fill();
  ctx.fillStyle = '#5a3a20';
  ctx.beginPath(); ctx.ellipse(14, -1.5, 3, 2.6, 0, 0, ДВА_ПИ); ctx.fill();

  /* Вспышка */
  if (опции.вспышка > 0){
    const яв = Math.min(1, опции.вспышка * 10);
    ctx.fillStyle = 'rgba(255,230,140,' + (яв * 0.9) + ')';
    ctx.beginPath(); ctx.arc(30, -1.5, 8 * яв, 0, ДВА_ПИ); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,220,' + яв + ')';
    ctx.beginPath(); ctx.arc(30, -1.5, 4 * яв, 0, ДВА_ПИ); ctx.fill();
  }

  /* === ГОЛОВА === */
  ctx.fillStyle = '#c08858';
  ctx.beginPath(); ctx.arc(2, 0, 6, 0, ДВА_ПИ); ctx.fill();

  ctx.fillStyle = '#d9a679';
  ctx.beginPath(); ctx.arc(3, 0, 6.5, 0, ДВА_ПИ); ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  ctx.beginPath(); ctx.arc(4.5, 0, 5, 0, ДВА_ПИ); ctx.fill();

  /* === ШЛЯПА === */
  const поляШляпы  = ЭтоИгрок ? '#3a281a' : '#241408';
  const тульяШляпы = ЭтоИгрок ? '#4a3524' : '#2f1e10';

  ctx.fillStyle = поляШляпы;
  ctx.beginPath();
  ctx.ellipse(3, 0, 10.5, 10, 0, 0, ДВА_ПИ);
  ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(4, 0, 9.2, 8.8, 0, 0, ДВА_ПИ);
  ctx.fill();

  ctx.fillStyle = тульяШляпы;
  ctx.beginPath();
  ctx.arc(3, 0, 6, 0, ДВА_ПИ);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,220,160,0.18)';
  ctx.beginPath();
  ctx.arc(2, -2, 3.5, 0, ДВА_ПИ);
  ctx.fill();

  ctx.strokeStyle = '#1a0f08';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(3, 0, 6, 0, ДВА_ПИ);
  ctx.stroke();

  /* === БАНДАНА у врага === */
  if (!ЭтоИгрок){
    ctx.fillStyle = '#b02020';
    ctx.beginPath();
    ctx.arc(3, 0, 7.4, Math.PI * 0.10, Math.PI * 0.90);
    ctx.lineTo(3 + Math.cos(Math.PI * 0.90) * 7.4,
               0 + Math.sin(Math.PI * 0.90) * 7.4);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#8a1818';
    ctx.beginPath();
    ctx.arc(9, 0, 2.2, 0, ДВА_ПИ);
    ctx.fill();
  }

  ctx.restore();
}

/* ---------- КОНЬ ---------- */
function нарисоватьКоня(к){
  ctx.save();
  ctx.translate(к.x, к.y);

  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.ellipse(4, 8, 32, 16, 0, 0, ДВА_ПИ);
  ctx.fill();

  ctx.rotate(к.угол);

  const кач = Math.sin(к.фазаШага) * 3.5;

  /* Ноги */
  ctx.fillStyle = '#4a2f1c';
  ctx.beginPath(); ctx.ellipse(-12, -10 + кач, 7.5, 5, 0, 0, ДВА_ПИ); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-12,  10 - кач, 7.5, 5, 0, 0, ДВА_ПИ); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 12, -10 - кач, 7.5, 5, 0, 0, ДВА_ПИ); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 12,  10 + кач, 7.5, 5, 0, 0, ДВА_ПИ); ctx.fill();

  /* Копыта */
  ctx.fillStyle = '#241610';
  ctx.beginPath(); ctx.ellipse(-16, -10 + кач, 3.5, 3, 0, 0, ДВА_ПИ); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-16,  10 - кач, 3.5, 3, 0, 0, ДВА_ПИ); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 16, -10 - кач, 3.5, 3, 0, 0, ДВА_ПИ); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 16,  10 + кач, 3.5, 3, 0, 0, ДВА_ПИ); ctx.fill();

  /* Хвост */
  ctx.fillStyle = '#3a2412';
  ctx.beginPath(); ctx.ellipse(-29, 0, 8, 5.5, 0, 0, ДВА_ПИ); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,160,0.10)';
  ctx.beginPath(); ctx.ellipse(-30, -1, 4, 2.5, 0, 0, ДВА_ПИ); ctx.fill();

  /* Тело */
  ctx.fillStyle = '#7a4f2a';
  ctx.beginPath(); ctx.ellipse(0, 0, 26, 14, 0, 0, ДВА_ПИ); ctx.fill();
  ctx.strokeStyle = '#4a2f1c';
  ctx.lineWidth = 2;
  ctx.stroke();

  /* Блик */
  ctx.fillStyle = 'rgba(255,220,160,0.15)';
  ctx.beginPath(); ctx.ellipse(2, -5, 16, 4, 0, 0, ДВА_ПИ); ctx.fill();

  /* Шея */
  ctx.fillStyle = '#7a4f2a';
  ctx.beginPath(); ctx.ellipse(25, 0, 11, 8, 0, 0, ДВА_ПИ); ctx.fill();
  ctx.stroke();

  /* Голова */
  ctx.beginPath(); ctx.ellipse(36, 0, 8, 5.5, 0, 0, ДВА_ПИ); ctx.fill();
  ctx.stroke();

  /* Глаз */
  ctx.fillStyle = '#1a0f08';
  ctx.beginPath(); ctx.arc(39, -2, 1.4, 0, ДВА_ПИ); ctx.fill();
  ctx.beginPath(); ctx.arc(39,  2, 1.4, 0, ДВА_ПИ); ctx.fill();

  /* Грива */
  ctx.fillStyle = '#3a2412';
  ctx.beginPath(); ctx.ellipse(20, 0, 6.5, 11, 0, 0, ДВА_ПИ); ctx.fill();

  /* Седло */
  ctx.fillStyle = '#5a3a20';
  ctx.beginPath(); ctx.ellipse(-2, 0, 11, 10, 0, 0, ДВА_ПИ); ctx.fill();
  ctx.strokeStyle = '#33200f';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.fillStyle = '#8a6a3a';
  ctx.beginPath(); ctx.arc(-2, 11, 2, 0, ДВА_ПИ); ctx.fill();
  ctx.beginPath(); ctx.arc(-2, -11, 2, 0, ДВА_ПИ); ctx.fill();

  ctx.restore();
}

/* ---------- ВСЕ СУЩНОСТИ ---------- */
function нарисоватьСущности(){
  /* Конь */
  if (конь) нарисоватьКоня(конь);

  /* Враги */
  for (const в of враги){
    ctx.save();
    if (в.урон > 0) ctx.globalAlpha = 0.85;

    нарисоватьКовбоя(в.x, в.y, в.угол, {
      этоИгрок: false,
      фазаШага: в.фазаШага,
      вспышка: в.вспышка,
      масштаб: 1.0
    });
    ctx.restore();

    /* Полоска здоровья */
    if (в.хп < в.максХп){
      const w = 32, h = 4;
      const px = в.x - w / 2, py = в.y - 30;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(px - 1, py - 1, w + 2, h + 2);
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(px, py, w * (в.хп / в.максХп), h);
    }

    /* Метка Меткого глаза */
    if (игрок.мгАктивен){
      ctx.strokeStyle = 'rgba(255,240,160,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(в.x, в.y, 22, 0, ДВА_ПИ);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255,240,160,0.5)';
      ctx.beginPath();
      ctx.moveTo(в.x - 30, в.y); ctx.lineTo(в.x - 24, в.y);
      ctx.moveTo(в.x + 24, в.y); ctx.lineTo(в.x + 30, в.y);
      ctx.stroke();
    }
  }

  /* Игрок */
  if (игрок.хп > 0){
    нарисоватьКовбоя(игрок.x, игрок.y, игрок.угол, {
      этоИгрок: true,
      фазаШага: игрок.фазаШага,
      вспышка: игрок.откатВыстрела > 0.12 ? 1 : 0,
      масштаб: 1.15
    });
  }

  /* Пули */
  for (const п of пули){
    const a = Math.atan2(п.vy, п.vx);
    const дл = п.дружеская ? 22 : 15;

    ctx.save();
    ctx.translate(п.x, п.y);
    ctx.rotate(a);

    const гр = ctx.createLinearGradient(-дл, 0, 6, 0);
    if (п.дружеская){
      гр.addColorStop(0, 'rgba(255,235,150,0)');
      гр.addColorStop(1, 'rgba(255,245,190,1)');
    } else {
      гр.addColorStop(0, 'rgba(255,140,60,0)');
      гр.addColorStop(1, 'rgba(255,190,110,1)');
    }
    ctx.fillStyle = гр;
    ctx.fillRect(-дл, -1.8, дл + 6, 3.6);
    ctx.restore();
  }

  /* Частицы */
  for (const ч of частицы){
    const a = огр(ч.жизнь / ч.макс, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = ч.цвет;
    const s = ч.размер * (0.4 + a * 0.6);
    ctx.fillRect(ч.x - s / 2, ч.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;

  /* Индикатор перезарядки */
  if (игрок.перезарядка > 0){
    const прогр = 1 - игрок.перезарядка / 1.35;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(игрок.x, игрок.y - 38, 15, -Math.PI / 2, -Math.PI / 2 + ДВА_ПИ);
    ctx.stroke();

    ctx.strokeStyle = '#e8c98a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(игрок.x, игрок.y - 38, 15, -Math.PI / 2, -Math.PI / 2 + ДВА_ПИ * прогр);
    ctx.stroke();
  }

  /* Подсказка над конём */
  if (!игрок.верхом && конь && раст(конь.x, конь.y, игрок.x, игрок.y) < 100){
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    скругПрямоуг(ctx, конь.x - 42, конь.y - 52, 84, 22, 6);
    ctx.fill();
    ctx.fillStyle = '#e8c98a';
    ctx.font = 'bold 12px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText(ЭТО_ТАЧ ? 'КОНЬ' : '[ E ] конь', конь.x, конь.y - 37);
    ctx.textAlign = 'left';
  }
}

   ИНТЕРФЕЙС
   ========================================================== */

/* Мини-карта */
function нарисоватьМиниКарту(){
  const S = 150;
  const px = Ш - S - 20;
  const py = 20;
  const дальность = 1400;
  const k = S / (дальность * 2);
  const цx = px + S / 2;
  const цy = py + S / 2;

  ctx.save();
  ctx.beginPath();
  ctx.rect(px, py, S, S);
  ctx.clip();

  ctx.fillStyle = 'rgba(22,14,7,0.78)';
  ctx.fillRect(px, py, S, S);

  /* Сетка */
  ctx.strokeStyle = 'rgba(220,190,140,0.07)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++){
    ctx.beginPath();
    ctx.moveTo(px, py + (S * i) / 4); ctx.lineTo(px + S, py + (S * i) / 4);
    ctx.moveTo(px + (S * i) / 4, py); ctx.lineTo(px + (S * i) / 4, py + S);
    ctx.stroke();
  }

  /* Дома */
  ctx.fillStyle = 'rgba(150,115,72,0.9)';
  for (const д of дома){
    const bx = цx + (д.x - игрок.x) * k;
    const by = цy + (д.y - игрок.y) * k;
    ctx.fillRect(bx, by, д.w * k, д.h * k);
  }

  /* Враги */
  ctx.fillStyle = '#e0503c';
  for (const в of враги){
    const ex = цx + (в.x - игрок.x) * k;
    const ey = цy + (в.y - игрок.y) * k;
    ctx.beginPath(); ctx.arc(ex, ey, 3.2, 0, ДВА_ПИ); ctx.fill();
  }

  /* Конь */
  if (конь && !игрок.верхом){
    ctx.fillStyle = '#c9a06a';
    ctx.beginPath();
    ctx.arc(цx + (конь.x - игрок.x) * k, цy + (конь.y - игрок.y) * k, 3.2, 0, ДВА_ПИ);
    ctx.fill();
  }

  /* Игрок */
  ctx.fillStyle = '#fff6d8';
  ctx.beginPath(); ctx.arc(цx, цy, 3.8, 0, ДВА_ПИ); ctx.fill();

  /* Направление */
  ctx.strokeStyle = 'rgba(255,246,216,0.75)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(цx, цy);
  ctx.lineTo(цx + Math.cos(игрок.угол) * 16, цy + Math.sin(игрок.угол) * 16);
  ctx.stroke();

  /* Сектор обзора */
  ctx.strokeStyle = 'rgba(255,200,120,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(цx, цy);
  ctx.lineTo(цx + Math.cos(игрок.угол - 0.5) * 60, цy + Math.sin(игрок.угол - 0.5) * 60);
  ctx.moveTo(цx, цy);
  ctx.lineTo(цx + Math.cos(игрок.угол + 0.5) * 60, цy + Math.sin(игрок.угол + 0.5) * 60);
  ctx.stroke();

  ctx.restore();

  /* Рамка */
  ctx.strokeStyle = 'rgba(220,190,140,0.55)';
  ctx.lineWidth = 2;
  ctx.strokeRect(px, py, S, S);

  ctx.fillStyle = 'rgba(220,190,140,0.7)';
  ctx.font = 'bold 11px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('КАРТА', px + 5, py - 6);
}

/* Прицел */
function нарисоватьПрицел(){
  let cx, cy;

  if (ЭТО_ТАЧ){
    if (!стикПрицел.активен) return;
    const px = игрок.x - камера.x;
    const py = игрок.y - камера.y;
    const дл = Math.hypot(стикПрицел.dx, стикПрицел.dy) || 1;
    const dx = стикПрицел.dx / дл;
    const dy = стикПрицел.dy / дл;
    cx = px + dx * 200;
    cy = py + dy * 200;
  } else {
    if (!мышь.есть) return;
    cx = мышь.x;
    cy = мышь.y;
  }

  ctx.save();
  if (игрок.мгАктивен){
    ctx.strokeStyle = 'rgba(255,235,150,0.95)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 14, 0, ДВА_ПИ); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 24, cy); ctx.lineTo(cx - 9, cy);
    ctx.moveTo(cx + 9, cy);  ctx.lineTo(cx + 24, cy);
    ctx.moveTo(cx, cy - 24); ctx.lineTo(cx, cy - 9);
    ctx.moveTo(cx, cy + 9);  ctx.lineTo(cx, cy + 24);
    ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(255,246,220,0.88)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 16, cy); ctx.lineTo(cx - 5, cy);
    ctx.moveTo(cx + 5, cy);  ctx.lineTo(cx + 16, cy);
    ctx.moveTo(cx, cy - 16); ctx.lineTo(cx, cy - 5);
    ctx.moveTo(cx, cy + 5);  ctx.lineTo(cx, cy + 16);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 2.2, 0, ДВА_ПИ);
    ctx.fillStyle = 'rgba(255,246,220,0.9)';
    ctx.fill();
  }
  ctx.restore();
}

/* Виртуальный стик */
function нарисоватьСтик(ст, цвет){
  if (!ст.активен) return;
  const { ox, oy, x, y } = ст;

  ctx.save();

  /* База */
  ctx.fillStyle = 'rgba(20,12,6,0.30)';
  ctx.beginPath(); ctx.arc(ox, oy, РАДИУС_СТИКА, 0, ДВА_ПИ); ctx.fill();
  ctx.strokeStyle = 'rgba(220,190,140,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(ox, oy, РАДИУС_СТИКА, 0, ДВА_ПИ); ctx.stroke();

  /* Ручка */
  const dx = x - ox, dy = y - oy;
  const дл = Math.hypot(dx, dy);
  const макс = РАДИУС_СТИКА;
  let кx, кy;
  if (дл > макс){
    кx = ox + dx / дл * макс;
    кy = oy + dy / дл * макс;
  } else {
    кx = x; кy = y;
  }

  /* Свечение */
  const гр = ctx.createRadialGradient(кx, кy, 2, кx, кy, 28);
  гр.addColorStop(0, цвет);
  гр.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = гр;
  ctx.beginPath(); ctx.arc(кx, кy, 28, 0, ДВА_ПИ); ctx.fill();

  /* Кружок */
  ctx.fillStyle = 'rgba(240,220,174,0.85)';
  ctx.beginPath(); ctx.arc(кx, кy, 20, 0, ДВА_ПИ); ctx.fill();
  ctx.strokeStyle = 'rgba(90,60,25,0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(кx, кy, 20, 0, ДВА_ПИ); ctx.stroke();

  ctx.restore();
}

/* Кнопки действий */
function нарисоватьКнопки(){
  for (const к of кнопкиДействий){
    const x = к.x(), y = к.y(), r = к.r;

    ctx.save();

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(x, y + 2, r + 2, 0, ДВА_ПИ); ctx.fill();

    const гр = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 2, x, y, r);
    if (к.нажата){
      гр.addColorStop(0, '#f0dcae');
      гр.addColorStop(1, к.цвет);
    } else {
      гр.addColorStop(0, к.цвет);
      гр.addColorStop(1, 'rgba(40,25,12,0.9)');
    }
    ctx.fillStyle = гр;
    ctx.beginPath(); ctx.arc(x, y, r, 0, ДВА_ПИ); ctx.fill();

    ctx.strokeStyle = 'rgba(220,190,140,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, ДВА_ПИ); ctx.stroke();

    ctx.fillStyle = к.нажата ? '#3a2212' : '#f0dcae';
    ctx.font = 'bold ' + (r > 34 ? 14 : 12) + 'px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(к.метка, x, y + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    ctx.restore();
  }
}

/* Основной HUD */
function нарисоватьHUD(){
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  if (состояние === 'меню'){ нарисоватьМеню(); return; }
  if (состояние === 'конец'){ нарисоватьКонец(); return; }

  /* --- Здоровье --- */
  const бw = 250, бh = 15, бx = 26, бy = В - 118;

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  скругПрямоуг(ctx, бx - 6, бy - 6, бw + 12, бh + 12, 8); ctx.fill();

  ctx.fillStyle = 'rgba(58,20,15,0.9)';
  скругПрямоуг(ctx, бx, бy, бw, бh, 5); ctx.fill();

  const шз = бw * огр(игрок.хп / игрок.максХп, 0, 1);
  if (шз > 0.5){
    const гр = ctx.createLinearGradient(бx, бy, бx, бy + бh);
    гр.addColorStop(0, '#e0503c');
    гр.addColorStop(1, '#8f1d16');
    ctx.fillStyle = гр;
    скругПрямоуг(ctx, бx, бy, шз, бh, 5); ctx.fill();
  }

  ctx.strokeStyle = 'rgba(230,200,150,0.35)';
  ctx.lineWidth = 1.5;
  скругПрямоуг(ctx, бx, бy, бw, бh, 5); ctx.stroke();

  ctx.fillStyle = 'rgba(240,220,174,0.7)';
  ctx.font = 'bold 11px Georgia, serif';
  ctx.fillText('ЗДОРОВЬЕ', бx + 2, бy - 10);

  /* --- Меткий глаз --- */
  const дy = бy + бh + 18, дh = 9;

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  скругПрямоуг(ctx, бx - 6, дy - 6, бw + 12, дh + 12, 8); ctx.fill();

  ctx.fillStyle = 'rgba(48,36,14,0.9)';
  скругПрямоуг(ctx, бx, дy, бw, дh, 5); ctx.fill();

  const шд = бw * огр(игрок.меткийГлаз, 0, 1);
  if (шд > 0.5){
    ctx.fillStyle = игрок.мгАктивен ? '#fff2b0' : '#d8a83a';
    скругПрямоуг(ctx, бx, дy, шд, дh, 5); ctx.fill();
  }

  ctx.strokeStyle = 'rgba(230,200,150,0.35)';
  ctx.lineWidth = 1.5;
  скругПрямоуг(ctx, бx, дy, бw, дh, 5); ctx.stroke();

  ctx.fillStyle = 'rgba(240,220,174,0.7)';
  ctx.fillText('МЕТКИЙ ГЛАЗ', бx + 2, дy - 8);

  /* --- Патроны --- */
  ctx.font = 'bold 30px Georgia, serif';
  ctx.fillStyle = игрок.патроны > 0 ? '#f0dcae' : '#c0392b';
  ctx.fillText(игрок.патроны + ' / ' + игрок.запас, бx, дy + дh + 40);

  ctx.font = 'bold 11px Georgia, serif';
  ctx.fillStyle = 'rgba(240,220,174,0.55)';
  ctx.fillText('ПАТРОНЫ', бx + 2, дy + дh + 56);

  /* --- Счёт --- */
  ctx.textAlign = 'right';
  ctx.font = 'bold 26px Georgia, serif';
  ctx.fillStyle = '#f0dcae';
  ctx.fillText('$ ' + счёт, Ш - 26, 208);

  ctx.font = '13px Georgia, serif';
  ctx.fillStyle = 'rgba(240,220,174,0.65)';
  ctx.fillText('Убито: ' + убийств, Ш - 26, 228);
  ctx.fillText('Время: ' + Math.floor(время) + 'с', Ш - 26, 246);

  ctx.textAlign = 'left';

  /* --- Первая подсказка --- */
  if (таймерПодсказки > 0 && состояние === 'игра'){
    const a = Math.min(1, таймерПодсказки / 0.6);
    ctx.globalAlpha = a;

    ctx.textAlign = 'center';
    ctx.font = 'bold 16px Georgia, serif';
    ctx.fillStyle = 'rgba(240,220,174,0.9)';
    const сообщение = ЭТО_ТАЧ
      ? 'Левый палец — движение · Правый — прицел и огонь'
      : 'WASD — движение · Мышь — прицел · ЛКМ — огонь';
    ctx.fillText(сообщение, Ш / 2, 60);

    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  нарисоватьМиниКарту();

  /* Кнопки и стики — только на тач-устройствах */
  if (ЭТО_ТАЧ){
    нарисоватьКнопки();
    нарисоватьСтик(стикДвижение, 'rgba(220,190,140,0.55)');
    нарисоватьСтик(стикПрицел,   'rgba(220,120,60,0.60)');
  }

  нарисоватьПрицел();

  /* --- Виньетка --- */
  const вг = ctx.createRadialGradient(
    Ш / 2, В / 2, Math.min(Ш, В) * 0.35,
    Ш / 2, В / 2, Math.max(Ш, В) * 0.75
  );
  вг.addColorStop(0, 'rgba(0,0,0,0)');
  вг.addColorStop(1, 'rgba(0,0,0,0.58)');
  ctx.fillStyle = вг;
  ctx.fillRect(0, 0, Ш, В);

  /* --- Красная вспышка при уроне --- */
  if (вспышкаУрона > 0){
    ctx.fillStyle = 'rgba(160,20,20,' + (вспышкаУрона * 0.9) + ')';
    ctx.fillRect(0, 0, Ш, В);
  }

  /* --- Эффект Меткого глаза --- */
  if (игрок.мгАктивен){
    ctx.fillStyle = 'rgba(120,90,20,0.10)';
    ctx.fillRect(0, 0, Ш, В);

    const вг2 = ctx.createRadialGradient(
      Ш / 2, В / 2, Math.min(Ш, В) * 0.15,
      Ш / 2, В / 2, Math.max(Ш, В) * 0.62
    );
    вг2.addColorStop(0, 'rgba(0,0,0,0)');
    вг2.addColorStop(1, 'rgba(40,20,0,0.6)');
    ctx.fillStyle = вг2;
    ctx.fillRect(0, 0, Ш, В);
  }

  ctx.textAlign = 'left';
}

/* ---------- МЕНЮ ---------- */
function нарисоватьМеню(){
  ctx.fillStyle = 'rgba(14,9,5,0.9)';
  ctx.fillRect(0, 0, Ш, В);

  const гр = ctx.createRadialGradient(Ш / 2, В / 2, 50, Ш / 2, В / 2, Math.max(Ш, В) * 0.85);
  гр.addColorStop(0, 'rgba(90,60,25,0.38)');
  гр.addColorStop(1, 'rgba(0,0,0,0.88)');
  ctx.fillStyle = гр;
  ctx.fillRect(0, 0, Ш, В);

  ctx.textAlign = 'center';

  ctx.fillStyle = '#e8c98a';
  ctx.font = 'bold ' + Math.min(68, Ш / 12) + 'px Georgia, serif';
  ctx.fillText('RED DEAD CANVAS', Ш / 2, В / 2 - 130);

  ctx.fillStyle = 'rgba(232,201,138,0.55)';
  ctx.font = Math.min(20, Ш / 32) + 'px Georgia, serif';
  ctx.fillText('— вестерн от третьего лица —', Ш / 2, В / 2 - 88);

  /* Управление */
  ctx.fillStyle = 'rgba(232,220,190,0.88)';
  ctx.font = Math.min(16, Ш / 48) + 'px Georgia, serif';

  const строки = ЭТО_ТАЧ ? [
    'Левый палец — виртуальный стик движения',
    'Правый палец — прицел и автоматический огонь',
    'Кнопки справа: ПЕР — перезарядка, ГЛАЗ — Меткий глаз, КОНЬ — оседлать'
  ] : [
    'WASD — движение        Мышь — прицел        ЛКМ — огонь',
    'R — перезарядка        Q — Меткий глаз      E — оседлать коня',
    'Shift — бег            Выживай как можно дольше'
  ];

  строки.forEach((т, i) => {
    ctx.fillText(т, Ш / 2, В / 2 - 20 + i * 32);
  });

  const пульс = 0.55 + Math.sin(performance.now() / 350) * 0.45;
  ctx.fillStyle = 'rgba(255,225,150,' + пульс + ')';
  ctx.font = 'bold ' + Math.min(24, Ш / 30) + 'px Georgia, serif';
  ctx.fillText(ЭТО_ТАЧ ? 'КОСНИСЬ ЭКРАНА, ЧТОБЫ НАЧАТЬ' : 'НАЖМИ ПРОБЕЛ ИЛИ ЛКМ',
               Ш / 2, В / 2 + 150);

  ctx.textAlign = 'left';
}

/* ---------- ЭКРАН СМЕРТИ ---------- */
function нарисоватьКонец(){
  ctx.fillStyle = 'rgba(30,4,4,0.75)';
  ctx.fillRect(0, 0, Ш, В);

  ctx.textAlign = 'center';

  ctx.fillStyle = '#c0392b';
  ctx.font = 'bold ' + Math.min(72, Ш / 10) + 'px Georgia, serif';
  ctx.fillText('ТЫ ПОГИБ', Ш / 2, В / 2 - 80);

  ctx.fillStyle = '#e8c98a';
  ctx.font = 'bold 30px Georgia, serif';
  ctx.fillText('$ ' + счёт, Ш / 2, В / 2 + 6);

  ctx.fillStyle = 'rgba(232,220,190,0.85)';
  ctx.font = Math.min(18, Ш / 44) + 'px Georgia, serif';
  ctx.fillText('Врагов уложено: ' + убийств, Ш / 2, В / 2 + 48);
  ctx.fillText('Продержался: ' + Math.floor(время) + ' секунд', Ш / 2, В / 2 + 76);

  const пульс = 0.55 + Math.sin(performance.now() / 350) * 0.45;
  ctx.fillStyle = 'rgba(255,225,150,' + пульс + ')';
  ctx.font = 'bold ' + Math.min(22, Ш / 36) + 'px Georgia, serif';
  ctx.fillText(ЭТО_ТАЧ ? 'КОСНИСЬ ЭКРАНА — НАЧАТЬ ЗАНОВО' : 'НАЖМИ  R  ЧТОБЫ НАЧАТЬ ЗАНОВО',
               Ш / 2, В / 2 + 150);

  ctx.textAlign = 'left';
}

/* ==========================================================
   ОТРИСОВКА
   ========================================================== */
function отрисовать(){
  ctx.setTransform(ТЧ, 0, 0, ТЧ, 0, 0);
  ctx.clearRect(0, 0, Ш, В);

  const сх = тряска > 0 ? случ(-тряска, тряска) : 0;
  const сy = тряска > 0 ? случ(-тряска, тряска) : 0;

  ctx.save();
  ctx.translate(-камера.x + сх, -камера.y + сy);

  нарисоватьЗемлю();
  нарисоватьОбъекты();
  нарисоватьДома();
  нарисоватьСущности();

  ctx.restore();

  нарисоватьHUD();
}

/* ==========================================================
   ГЛАВНЫЙ ЦИКЛ
   ========================================================== */
function цикл(t){
  let dt = (t - последнийКадр) / 1000;
  последнийКадр = t;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  обновить(dt);
  отрисовать();

  requestAnimationFrame(цикл);
}

/* ==========================================================
   СТАРТ
   ========================================================== */
построитьТекстуруЗемли();
построитьМир();
обновитьКамеру(true);
requestAnimationFrame(цикл);

/* Скрываем адресную строку при первом касании (iOS) */
window.addEventListener('touchstart', function однажды(){
  window.removeEventListener('touchstart', однажды);
  window.scrollTo(0, 1);
}, { passive: true });

/* Предотвращаем случайный зум двумя пальцами */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
</script>
