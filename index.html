<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#140d07">
<title>Red Dead Canvas 3D — Вестерн от первого лица</title>
<style>
  /* ==========================================================
     БАЗОВЫЕ СТИЛИ
     ========================================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: Georgia, "Times New Roman", serif;
  }

  canvas {
    display: block;
    touch-action: none;
    background: #000;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  #подсказка {
    position: fixed;
    left: 0; right: 0; bottom: 6px;
    text-align: center;
    color: #e8d5b0;
    font: 12px Georgia, serif;
    opacity: .38;
    pointer-events: none;
    text-shadow: 0 2px 6px #000;
    padding: 0 10px;
  }

  @media (pointer: coarse) {
    #подсказка { display: none; }
  }
</style>
</head>
<body>
<canvas id="игра"></canvas>
<div id="подсказка">WASD — движение · Мышь — обзор · ЛКМ — огонь · R — перезарядка · Q — Меткий глаз · Shift — бег</div>

<script>
'use strict';

/* ==========================================================
   RED DEAD CANVAS 3D
   Настоящий 3D-шутер от первого лица на raycasting.
   Все текстуры рисуются процедурно.
   Работает на ПК и на iPad (тач).
   ========================================================== */

/* ==========================================================
   1. КОНСТАНТЫ И РАЗМЕРЫ
   ========================================================== */
const РАЗМЕР_ТЕКСТУРЫ = 64;               // размер одной текстуры (квадрат)
const МАСКА_ТЕКСТУРЫ = РАЗМЕР_ТЕКСТУРЫ - 1;

const РАЗМЕР_КАРТЫ = 32;                  // 32x32 клетки
const КАРТА = new Uint8Array(РАЗМЕР_КАРТЫ * РАЗМЕР_КАРТЫ);

const ПЛОСКОСТЬ_X = 0.66;                 // половина ширины плоскости проекции (FOV ≈ 66°)

/* Внутреннее (низкое) разрешение рендера */
let ШИРИНА_БУФ = 320;
let ВЫСОТА_БУФ = 200;

/* Вспомогательные буферы */
let imageData = null;
let буфер = null;                          // Uint32 пиксели кадра
const буферГлубины = new Float32Array(1024); // глубина стен по колонкам

/* ==========================================================
   2. ХОЛСТЫ
   ========================================================== */
const холст = document.getElementById('игра');
const ctx = холст.getContext('2d', { alpha: false });

const offCanvas = document.createElement('canvas');
const offCtx = offCanvas.getContext('2d', { alpha: false });

let Ш_ЭКРАНА = 0, В_ЭКРАНА = 0;

function настроитьРазмер() {
  Ш_ЭКРАНА = window.innerWidth;
  В_ЭКРАНА = window.innerHeight;

  холст.width  = Ш_ЭКРАНА;
  холст.height = В_ЭКРАНА;
  холст.style.width  = Ш_ЭКРАНА + 'px';
  холст.style.height = В_ЭКРАНА + 'px';

  /* Внутреннее разрешение — фиксированной высоты, ширина по пропорции */
  const пропорция = Ш_ЭКРАНА / В_ЭКРАНА;
  ВЫСОТА_БУФ = 220;
  ШИРИНА_БУФ = Math.floor(ВЫСОТА_БУФ * пропорция);
  if (ШИРИНА_БУФ > 480) ШИРИНА_БУФ = 480;
  if (ШИРИНА_БУФ < 160) ШИРИНА_БУФ = 160;

  offCanvas.width  = ШИРИНА_БУФ;
  offCanvas.height = ВЫСОТА_БУФ;

  imageData = offCtx.createImageData(ШИРИНА_БУФ, ВЫСОТА_БУФ);
  буфер = new Uint32Array(imageData.data.buffer);
}

window.addEventListener('resize', настроитьРазмер);
window.addEventListener('orientationchange', () => setTimeout(настроитьРазмер, 150));
настроитьРазмер();

/* ==========================================================
   3. УТИЛИТЫ
   ========================================================== */
const ДВА_ПИ = Math.PI * 2;
const случ   = (a, b) => a + Math.random() * (b - a);
const огр    = (v, a, b) => v < a ? a : (v > b ? b : v);
const раст   = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

/* Упаковка цвета в uint32 (формат ABGR, little-endian) */
function цвет(r, g, b, a = 255) {
  return ((a << 24) | (b << 16) | (g << 8) | r) >>> 0;
}

/* ==========================================================
   4. ПРОЦЕДУРНЫЕ ТЕКСТУРЫ
   Все текстуры рисуются на canvas и извлекаются в Uint32Array
   ========================================================== */
function извлечьТекстуру(painter) {
  const c = document.createElement('canvas');
  c.width = c.height = РАЗМЕР_ТЕКСТУРЫ;
  const cx = c.getContext('2d');
  painter(cx, РАЗМЕР_ТЕКСТУРЫ);
  const img = cx.getImageData(0, 0, РАЗМЕР_ТЕКСТУРЫ, РАЗМЕР_ТЕКСТУРЫ);
  const out = new Uint32Array(РАЗМЕР_ТЕКСТУРЫ * РАЗМЕР_ТЕКСТУРЫ);
  for (let i = 0; i < out.length; i++) {
    const r = img.data[i * 4];
    const g = img.data[i * 4 + 1];
    const b = img.data[i * 4 + 2];
    const a = img.data[i * 4 + 3];
    out[i] = ((a << 24) | (b << 16) | (g << 8) | r) >>> 0;
  }
  return out;
}

/* ---------- Текстура: деревянная стена ---------- */
function текстураДерево(cx, s) {
  cx.fillStyle = '#7a4f2a';
  cx.fillRect(0, 0, s, s);

  const полос = 8;
  const высота = s / полос;

  for (let i = 0; i < полос; i++) {
    cx.fillStyle = (i % 2 === 0) ? '#6d4423' : '#82522c';
    cx.fillRect(0, i * высота, s, высота - 1);

    /* Волокна */
    for (let j = 0; j < 30; j++) {
      const яркость = Math.random();
      if (яркость < 0.5) cx.fillStyle = 'rgba(50,30,15,' + (0.15 + Math.random() * 0.25) + ')';
      else cx.fillStyle = 'rgba(160,110,60,' + (0.10 + Math.random() * 0.20) + ')';
      cx.fillRect(Math.random() * s, i * высота + Math.random() * высота, 2 + Math.random() * 4, 1);
    }

    /* Гвозди */
    if (i % 2 === 0) {
      cx.fillStyle = '#3a2412';
      cx.fillRect(s * 0.1, i * высота + высота / 2, 1.5, 1.5);
      cx.fillRect(s * 0.9, i * высота + высота / 2, 1.5, 1.5);
    }
  }

  /* Вертикальные тёмные стыки */
  cx.strokeStyle = 'rgba(30,18,8,0.75)';
  cx.lineWidth = 1;
  for (let i = 1; i < полос; i++) {
    cx.beginPath();
    cx.moveTo(0, i * высота);
    cx.lineTo(s, i * высота);
    cx.stroke();
  }
}

/* ---------- Текстура: кирпич ---------- */
function текстураКирпич(cx, s) {
  cx.fillStyle = '#6a3a2a';
  cx.fillRect(0, 0, s, s);

  const р = 4, к = 8; /* 4 ряда по 8 кирпичей */
  const вК = s / р, шК = s / к;
  const зазор = 1.5;

  for (let ряд = 0; ряд < р; ряд++) {
    const смещение = (ряд % 2) ? шК / 2 : 0;
    for (let к2 = -1; к2 < к + 1; к2++) {
      const x = к2 * шК + смещение + зазор;
      const y = ряд * вК + зазор;
      const w = шК - зазор * 2;
      const h = вК - зазор * 2;

      const оттенок = 0.85 + Math.random() * 0.3;
      const r0 = Math.floor(140 * оттенок);
      const g0 = Math.floor(75 * оттенок);
      const b0 = Math.floor(55 * оттенок);
      cx.fillStyle = 'rgb(' + r0 + ',' + g0 + ',' + b0 + ')';
      cx.fillRect(x, y, w, h);

      /* Мелкие трещинки */
      if (Math.random() < 0.4) {
        cx.strokeStyle = 'rgba(60,30,20,0.6)';
        cx.lineWidth = 0.7;
        cx.beginPath();
        cx.moveTo(x + Math.random() * w, y);
        cx.lineTo(x + Math.random() * w, y + h);
        cx.stroke();
      }
    }
  }
}

/* ---------- Текстура: каменная стена ---------- */
function текстураКамень(cx, s) {
  cx.fillStyle = '#6a625a';
  cx.fillRect(0, 0, s, s);

  /* Крупные каменные блоки */
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * s;
    const y = Math.random() * s;
    const w = 6 + Math.random() * 14;
    const h = 5 + Math.random() * 10;
    const отт = 0.75 + Math.random() * 0.5;
    const r0 = Math.floor(120 * отт);
    const g0 = Math.floor(115 * отт);
    const b0 = Math.floor(108 * отт);
    cx.fillStyle = 'rgb(' + r0 + ',' + g0 + ',' + b0 + ')';
    cx.beginPath();
    cx.ellipse(x, y, w, h, Math.random() * Math.PI, 0, ДВА_ПИ);
    cx.fill();
    cx.strokeStyle = 'rgba(40,35,30,0.5)';
    cx.lineWidth = 0.8;
    cx.stroke();
  }

  /* Мелкие крупинки */
  for (let i = 0; i < 300; i++) {
    cx.fillStyle = 'rgba(' + Math.floor(Math.random() * 60) + ',' + Math.floor(Math.random() * 60) + ',' + Math.floor(Math.random() * 60) + ',0.35)';
    cx.fillRect(Math.random() * s, Math.random() * s, 1, 1);
  }
}

/* ---------- Текстура: дверь ---------- */
function текстураДверь(cx, s) {
  /* Деревянная основа */
  cx.fillStyle = '#5a3a20';
  cx.fillRect(0, 0, s, s);

  /* Рамка */
  cx.fillStyle = '#3a2412';
  cx.fillRect(0, 0, s, 4);
  cx.fillRect(0, s - 4, s, 4);
  cx.fillRect(0, 0, 4, s);
  cx.fillRect(s - 4, 0, 4, s);
  cx.fillRect(0, s / 2 - 2, s, 4);

  /* Панели */
  cx.fillStyle = '#6a4525';
  cx.fillRect(8, 8, s - 16, s / 2 - 16);
  cx.fillRect(8, s / 2 + 8, s - 16, s / 2 - 16);

  cx.strokeStyle = 'rgba(0,0,0,0.5)';
  cx.lineWidth = 1.5;
  cx.strokeRect(8, 8, s - 16, s / 2 - 16);
  cx.strokeRect(8, s / 2 + 8, s - 16, s / 2 - 16);

  /* Ручка */
  cx.fillStyle = '#c9a03a';
  cx.beginPath();
  cx.arc(s - 12, s / 2, 3, 0, ДВА_ПИ);
  cx.fill();
  cx.strokeStyle = '#7a5a20';
  cx.lineWidth = 1;
  cx.stroke();
}

/* ---------- Текстура: песок (пол) ---------- */
function текстураПесок(cx, s) {
  cx.fillStyle = '#c99a52';
  cx.fillRect(0, 0, s, s);

  /* Крапинки */
  for (let i = 0; i < 900; i++) {
    const отт = Math.random();
    let r0, g0, b0;
    if (отт < 0.4) { r0 = 180; g0 = 130; b0 = 70; }
    else if (отт < 0.75) { r0 = 220; g0 = 170; b0 = 100; }
    else { r0 = 140; g0 = 100; b0 = 55; }
    cx.fillStyle = 'rgba(' + r0 + ',' + g0 + ',' + b0 + ',' + (0.15 + Math.random() * 0.4) + ')';
    cx.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1);
  }

  /* Камешки */
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * s, y = Math.random() * s;
    const r = 1 + Math.random() * 2;
    cx.fillStyle = 'rgba(90,70,45,0.6)';
    cx.beginPath();
    cx.arc(x, y, r, 0, ДВА_ПИ);
    cx.fill();
    cx.fillStyle = 'rgba(220,190,140,0.4)';
    cx.beginPath();
    cx.arc(x - 0.5, y - 0.5, r * 0.5, 0, ДВА_ПИ);
    cx.fill();
  }

  /* Травинки */
  for (let i = 0; i < 20; i++) {
    const x = Math.random() * s, y = Math.random() * s;
    cx.strokeStyle = 'rgba(110,120,55,0.5)';
    cx.lineWidth = 1;
    cx.beginPath();
    cx.moveTo(x, y);
    cx.lineTo(x + (Math.random() - 0.5) * 3, y - 2 - Math.random() * 3);
    cx.stroke();
  }
}

/* ---------- Текстура: небо (используем как вертикальный градиент) ---------- */
/* Небо мы будем рисовать напрямую в буфер градиентом — не текстурой */

/* ---------- Спрайт: ковбой-враг (с альфа-каналом) ---------- */
function спрайтКовбой(cx, s) {
  /* Фон прозрачный */
  cx.clearRect(0, 0, s, s);

  const центр = s / 2;

  /* Ноги */
  cx.fillStyle = '#2a1c12';
  cx.fillRect(центр - 8, s * 0.72, 6, s * 0.26);
  cx.fillRect(центр + 2, s * 0.72, 6, s * 0.26);

  /* Ботинки */
  cx.fillStyle = '#1a1008';
  cx.fillRect(центр - 9, s * 0.95, 8, s * 0.04);
  cx.fillRect(центр + 1, s * 0.95, 8, s * 0.04);

  /* Пальто */
  cx.fillStyle = '#6a3020';
  cx.beginPath();
  cx.moveTo(центр - 12, s * 0.42);
  cx.lineTo(центр + 12, s * 0.42);
  cx.lineTo(центр + 10, s * 0.75);
  cx.lineTo(центр - 10, s * 0.75);
  cx.closePath();
  cx.fill();

  /* Тёмная обводка пальто */
  cx.strokeStyle = '#3a1808';
  cx.lineWidth = 1;
  cx.stroke();

  /* Рубашка / жилет */
  cx.fillStyle = '#7a3020';
  cx.beginPath();
  cx.moveTo(центр - 7, s * 0.42);
  cx.lineTo(центр + 7, s * 0.42);
  cx.lineTo(центр + 6, s * 0.60);
  cx.lineTo(центр - 6, s * 0.60);
  cx.closePath();
  cx.fill();

  /* Пуговицы */
  cx.fillStyle = '#d9b23a';
  for (let i = 0; i < 3; i++) {
    cx.beginPath();
    cx.arc(центр, s * 0.45 + i * s * 0.05, 1.2, 0, ДВА_ПИ);
    cx.fill();
  }

  /* Пояс */
  cx.fillStyle = '#3a2010';
  cx.fillRect(центр - 12, s * 0.62, 24, s * 0.05);

  /* Пряжка */
  cx.fillStyle = '#d9b23a';
  cx.fillRect(центр - 2, s * 0.625, 4, 3);

  /* Руки */
  cx.fillStyle = '#5a2010';
  cx.fillRect(центр - 15, s * 0.44, 4, s * 0.22);
  cx.fillRect(центр + 11, s * 0.44, 4, s * 0.22);

  /* Кисти рук */
  cx.fillStyle = '#d9a679';
  cx.fillRect(центр - 15, s * 0.63, 4, 4);
  cx.fillRect(центр + 11, s * 0.63, 4, 4);

  /* Револьвер в правой руке */
  cx.fillStyle = '#1a1a22';
  cx.fillRect(центр + 13, s * 0.58, 8, 3);

  /* Голова — шея */
  cx.fillStyle = '#c08858';
  cx.fillRect(центр - 3, s * 0.38, 6, s * 0.05);

  /* Голова — лицо */
  cx.fillStyle = '#d9a679';
  cx.beginPath();
  cx.arc(центр, s * 0.32, 7, 0, ДВА_ПИ);
  cx.fill();

  /* Затенение лица */
  cx.fillStyle = 'rgba(0,0,0,0.20)';
  cx.beginPath();
  cx.arc(центр + 2, s * 0.32, 5, 0, ДВА_ПИ);
  cx.fill();

  /* Глаза */
  cx.fillStyle = '#1a0a05';
  cx.fillRect(центр - 3, s * 0.31, 1.5, 1.5);
  cx.fillRect(центр + 1.5, s * 0.31, 1.5, 1.5);

  /* Бандана на лице (у врага) */
  cx.fillStyle = '#b02020';
  cx.fillRect(центр - 7, s * 0.33, 14, 3);
  cx.fillStyle = '#8a1818';
  cx.fillRect(центр - 7, s * 0.345, 14, 1);

  /* Шляпа — поля */
  cx.fillStyle = '#2a1a10';
  cx.beginPath();
  cx.ellipse(центр, s * 0.27, 12, 4, 0, 0, ДВА_ПИ);
  cx.fill();

  /* Шляпа — тулья */
  cx.fillStyle = '#3a2418';
  cx.beginPath();
  cx.ellipse(центр, s * 0.24, 7, 5, 0, 0, ДВА_ПИ);
  cx.fill();

  /* Лента шляпы */
  cx.fillStyle = '#1a0a05';
  cx.beginPath();
  cx.ellipse(центр, s * 0.265, 7, 1.6, 0, 0, ДВА_ПИ);
  cx.fill();

  /* Блик на тулье */
  cx.fillStyle = 'rgba(255,220,160,0.20)';
  cx.beginPath();
  cx.ellipse(центр - 2, s * 0.22, 3, 2, 0, 0, ДВА_ПИ);
  cx.fill();
}

/* ---------- Спрайт: кактус ---------- */
function спрайтКактус(cx, s) {
  cx.clearRect(0, 0, s, s);
  const центр = s / 2;

  /* Основной ствол */
  cx.fillStyle = '#4a7a3a';
  cx.fillRect(центр - 6, s * 0.30, 12, s * 0.68);

  /* Левая рука */
  cx.fillRect(центр - 14, s * 0.45, 8, 4);
  cx.fillRect(центр - 14, s * 0.35, 4, s * 0.15);

  /* Правая рука */
  cx.fillRect(центр + 6, s * 0.40, 8, 4);
  cx.fillRect(центр + 10, s * 0.25, 4, s * 0.20);

  /* Тёмная обводка */
  cx.strokeStyle = '#2f5226';
  cx.lineWidth = 1.5;
  cx.strokeRect(центр - 6, s * 0.30, 12, s * 0.68);

  /* Иголки */
  cx.strokeStyle = 'rgba(200,230,160,0.7)';
  cx.lineWidth = 0.8;
  for (let i = 0; i < 25; i++) {
    const x = центр + (Math.random() - 0.5) * 12;
    const y = s * 0.32 + Math.random() * s * 0.62;
    cx.beginPath();
    cx.moveTo(x, y);
    cx.lineTo(x + (Math.random() - 0.5) * 3, y - 1 - Math.random() * 2);
    cx.stroke();
  }

  /* Блик */
  cx.fillStyle = 'rgba(255,255,255,0.15)';
  cx.fillRect(центр - 4, s * 0.35, 3, s * 0.6);
}

/* ---------- Спрайт: бочка ---------- */
function спрайтБочка(cx, s) {
  cx.clearRect(0, 0, s, s);

  const центрX = s / 2;
  const верх = s * 0.30;
  const низ  = s * 0.95;

  /* Бочка */
  cx.fillStyle = '#8a5a30';
  cx.beginPath();
  cx.moveTo(центрX - 12, верх);
  cx.lineTo(центрX + 12, верх);
  cx.lineTo(центрX + 14, низ);
  cx.lineTo(центрX - 14, низ);
  cx.closePath();
  cx.fill();

  /* Вертикальные тени */
  const гр = cx.createLinearGradient(центрX - 14, 0, центрX + 14, 0);
  гр.addColorStop(0, 'rgba(0,0,0,0.35)');
  гр.addColorStop(0.4, 'rgba(255,220,160,0.15)');
  гр.addColorStop(1, 'rgba(0,0,0,0.35)');
  cx.fillStyle = гр;
  cx.beginPath();
  cx.moveTo(центрX - 12, верх);
  cx.lineTo(центрX + 12, верх);
  cx.lineTo(центрX + 14, низ);
  cx.lineTo(центрX - 14, низ);
  cx.closePath();
  cx.fill();

  /* Обручи */
  cx.strokeStyle = '#3a2410';
  cx.lineWidth = 2.5;
  for (const y of [верх + 4, s * 0.62, низ - 4]) {
    cx.beginPath();
    cx.moveTo(центрX - 13, y);
    cx.lineTo(центрX + 13, y);
    cx.stroke();
  }

  /* Крышка (эллипс) */
  cx.fillStyle = '#a06c3a';
  cx.beginPath();
  cx.ellipse(центрX, верх, 12, 3.5, 0, 0, ДВА_ПИ);
  cx.fill();
  cx.strokeStyle = '#4a2f18';
  cx.lineWidth = 1.2;
  cx.stroke();
}

/* ---------- Строим все текстуры ---------- */
const ТЕКСТУРЫ = [];
ТЕКСТУРЫ[1] = извлечьТекстуру(текстураДерево);
ТЕКСТУРЫ[2] = извлечьТекстуру(текстураКирпич);
ТЕКСТУРЫ[3] = извлечьТекстуру(текстураКамень);
ТЕКСТУРЫ[4] = извлечьТекстуру(текстураДверь);

const ТЕКСТУРА_ПОЛА = извлечьТекстуру(текстураПесок);

const СПРАЙТ_КОВБОЙ = извлечьТекстуру(спрайтКовбой);
const СПРАЙТ_КАКТУС  = извлечьТекстуру(спрайтКактус);
const СПРАЙТ_БОЧКА   = извлечьТекстуру(спрайтБочка);

/* ==========================================================
   5. КАРТА МИРА (вестерн-городок)
   ========================================================== */
function построитьКарту() {
  КАРТА.fill(0);

  /* Периметр — деревянный забор */
  for (let x = 0; x < РАЗМЕР_КАРТЫ; x++) {
    КАРТА[x] = 1;
    КАРТА[(РАЗМЕР_КАРТЫ - 1) * РАЗМЕР_КАРТЫ + x] = 1;
  }
  for (let y = 0; y < РАЗМЕР_КАРТЫ; y++) {
    КАРТА[y * РАЗМЕР_КАРТЫ] = 1;
    КАРТА[y * РАЗМЕР_КАРТЫ + РАЗМЕР_КАРТЫ - 1] = 1;
  }

  /* Вспомогательная функция установки прямоугольника стен */
  function стена(x, y, w, h, тип) {
    for (let j = y; j < y + h; j++) {
      for (let i = x; i < x + w; i++) {
        if (i > 0 && i < РАЗМЕР_КАРТЫ - 1 && j > 0 && j < РАЗМЕР_КАРТЫ - 1) {
          КАРТА[j * РАЗМЕР_КАРТЫ + i] = тип;
        }
      }
    }
  }

  /* Пустое пространство внутри */
  function очистить(x, y, w, h) {
    for (let j = y; j < y + h; j++) {
      for (let i = x; i < x + w; i++) {
        if (i > 0 && i < РАЗМЕР_КАРТЫ - 1 && j > 0 && j < РАЗМЕР_КАРТЫ - 1) {
          КАРТА[j * РАЗМЕР_КАРТЫ + i] = 0;
        }
      }
    }
  }

  /* --- Дома --- */

  /* Дом 1: деревянный, левый верх */
  стена(3, 3, 6, 5, 1);
  очистить(4, 4, 4, 3);
  КАРТА[5 * РАЗМЕР_КАРТЫ + 8] = 4; /* дверь */

  /* Дом 2: кирпичный, правый верх */
  стена(22, 3, 6, 5, 2);
  очистить(23, 4, 4, 3);
  КАРТА[5 * РАЗМЕР_КАРТЫ + 22] = 4;

  /* Дом 3: каменный, левый низ */
  стена(3, 22, 6, 6, 3);
  очистить(4, 23, 4, 4);
  КАРТА[22 * РАЗМЕР_КАРТЫ + 5] = 4;

  /* Дом 4: кирпичный, правый низ */
  стена(22, 22, 6, 6, 2);
  очистить(23, 23, 4, 4);
  КАРТА[22 * РАЗМЕР_КАРТЫ + 25] = 4;

  /* Дом 5: центральный салун — большой деревянный */
  стена(12, 12, 8, 8, 1);
  очистить(13, 13, 6, 6);
  /* Двойная дверь салуна */
  КАРТА[19 * РАЗМЕР_КАРТЫ + 15] = 4;
  КАРТА[19 * РАЗМЕР_КАРТЫ + 16] = 4;

  /* Одинокие стены/навесы для укрытия */
  стена(18, 5, 1, 3, 1);
  стена(11, 24, 4, 1, 3);
  стена(26, 12, 1, 5, 2);

  /* Немного разбросанных одиночных блоков */
  стена(8, 15, 1, 1, 3);
  стена(23, 15, 1, 1, 3);
  стена(15, 8, 1, 1, 1);
  стена(16, 24, 1, 1, 1);

  /* Пара колодцев/столбов в центре улицы */
  стена(10, 10, 1, 1, 3);
  стена(21, 21, 1, 1, 3);
  стена(10, 21, 1, 1, 3);
  стена(21, 10, 1, 1, 3);
}

построитьКарту();

/* Проверка — является ли клетка стеной */
function этоСтена(x, y) {
  if (x < 0 || y < 0 || x >= РАЗМЕР_КАРТЫ || y >= РАЗМЕР_КАРТЫ) return true;
  return КАРТА[Math.floor(y) * РАЗМЕР_КАРТЫ + Math.floor(x)] > 0;
}

/* ==========================================================
   6. ИГРОК И СОСТОЯНИЕ
   ========================================================== */
const игрок = {
  x: 16, y: 24,
  угол: -Math.PI / 2,
  хп: 100, максХп: 100,
  патроны: 6, максПатронов: 6, запас: 42,
  откатВыстрела: 0,
  перезарядка: 0,
  меткийГлаз: 1,
  мгАктивен: false,
  тряска: 0,
  вспышкаСтвола: 0
};

let состояние = 'меню'; /* меню | игра | конец */
let время = 0;
let счёт = 0;
let убийств = 0;
let таймерСпавна = 0;
let таймерПодсказки = 3;

/* Спрайты (враги + объекты) */
let спрайты = [];

/* Пули игрока (хитскан) и урон — простая логика */
let эффекты = []; /* частицы попадания */

/* ==========================================================
   7. ВВОД: КЛАВИАТУРА И МЫШЬ
   ========================================================== */
const клавиши = Object.create(null);
const мышь = { dx: 0, нажата: false };
let указательЗахвачен = false;

window.addEventListener('keydown', e => {
  клавиши[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();

  if (e.code === 'KeyQ') переключитьМеткийГлаз();
  if (e.code === 'KeyR') {
    if (состояние === 'конец') начатьИгру();
    else начатьПерезарядку();
  }
  if (e.code === 'Space' && состояние === 'меню') начатьИгру();
});

window.addEventListener('keyup', e => { клавиши[e.code] = false; });

холст.addEventListener('click', () => {
  if (состояние === 'меню' || состояние === 'конец') {
    начатьИгру();
    return;
  }
  if (!ЭТО_ТАЧ && !указательЗахвачен) {
    холст.requestPointerLock();
  }
});

document.addEventListener('pointerlockchange', () => {
  указательЗахвачен = document.pointerLockElement === холст;
});

document.addEventListener('mousemove', e => {
  if (указательЗахвачен) {
    мышь.dx += e.movementX;
  }
});

холст.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (состояние === 'игра') мышь.нажата = true;
});

window.addEventListener('mouseup', e => {
  if (e.button === 0) мышь.нажата = false;
});

холст.addEventListener('contextmenu', e => e.preventDefault());

/* ==========================================================
   8. ВВОД: ТАЧ (iPad)
   ========================================================== */
const ЭТО_ТАЧ = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

/* Левый стик — движение */
const левыйСтик = { активен: false, id: null, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0 };
/* Правый — обзор + авто-огонь при удержании */
const правыйСтик = { активен: false, id: null, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0, тапТаймер: 0, стрелял: false };

const РАДИУС_СТИКА = 70;
const МЁРТВАЯ_ЗОНА = 0.14;

/* Кнопки действий */
const кнопки = [
  { ключ: 'перезарядка', метка: 'ПЕР', x: () => Ш_ЭКРАНА - 60, y: () => 260, r: 32, цвет: '#c9a03a' },
  { ключ: 'меткийГлаз',  метка: 'ГЛАЗ', x: () => Ш_ЭКРАНА - 60, y: () => 340, r: 32, цвет: '#d8a83a' },
  { ключ: 'бег',         метка: 'БЕГ',  x: () => 60,           y: () => В_ЭКРАНА - 60, r: 32, цвет: '#8a5a30' }
];

let бег = false;

function попаданиеВКнопку(x, y) {
  for (const к of кнопки) {
    if (раст(x, y, к.x(), к.y()) < к.r + 18) return к;
  }
  return null;
}

function обработатьКосStart(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const x = t.clientX, y = t.clientY;

    const к = попаданиеВКнопку(x, y);
    if (к) {
      к.tid = t.identifier;
      нажатьКнопку(к);
      continue;
    }

    /* Левая половина — движение */
    if (x < Ш_ЭКРАНА * 0.5 && !левыйСтик.активен) {
      левыйСтик.активен = true;
      левыйСтик.id = t.identifier;
      левыйСтик.ox = x; левыйСтик.oy = y;
      левыйСтик.x  = x; левыйСтик.y  = y;
      левыйСтик.dx = 0; левыйСтик.dy = 0;
      continue;
    }

    /* Правая половина — обзор/огонь */
    if (x >= Ш_ЭКРАНА * 0.5 && !правыйСтик.активен) {
      правыйСтик.активен = true;
      правыйСтик.id = t.identifier;
      правыйСтик.ox = x; правыйСтик.oy = y;
      правыйСтик.x  = x; правыйСтик.y  = y;
      правыйСтик.dx = 0; правыйСтик.dy = 0;
      правыйСтик.тапТаймер = performance.now();
      правыйСтик.стрелял = false;
      continue;
    }
  }
}

function обработатьКосMove(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const x = t.clientX, y = t.clientY;

    if (левыйСтик.активен && t.identifier === левыйСтик.id) {
      левыйСтик.x = x; левыйСтик.y = y;
      let dx = x - левыйСтик.ox;
      let dy = y - левыйСтик.oy;
      const дл = Math.hypot(dx, dy);
      if (дл > РАДИУС_СТИКА) {
        dx = dx / дл * РАДИУС_СТИКА;
        dy = dy / дл * РАДИУС_СТИКА;
        левыйСтик.ox = x - dx;
        левыйСтик.oy = y - dy;
      }
      левыйСтик.dx = dx / РАДИУС_СТИКА;
      левыйСтик.dy = dy / РАДИУС_СТИКА;
      if (Math.hypot(левыйСтик.dx, левыйСтик.dy) < МЁРТВАЯ_ЗОНА) {
        левыйСтик.dx = 0; левыйСтик.dy = 0;
      }
    }

    if (правыйСтик.активен && t.identifier === правыйСтик.id) {
      /* Разница движений = поворот камеры */
      const dx = x - правыйСтик.x;
      const dy = y - правыйСтик.y;
      игрок.угол += dx * 0.006;
      /* Лёгкий вертикальный «наклон» — можно использовать для покачивания */
      правыйСтик.x = x; правыйСтик.y = y;
      if (Math.hypot(dx, dy) > 4) правыйСтик.стрелял = true;
    }
  }
}

function обработатьКосEnd(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];

    for (const к of кнопки) {
      if (к.tid === t.identifier) {
        к.tid = null;
        if (к.ключ === 'бег') бег = false;
      }
    }

    if (левыйСтик.активен && t.identifier === левыйСтик.id) {
      левыйСтик.активен = false;
      левыйСтик.id = null;
      левыйСтик.dx = 0; левыйСтик.dy = 0;
    }

    if (правыйСтик.активен && t.identifier === правыйСтик.id) {
      /* Если палец быстро тапнул — выстрел */
      const время = performance.now() - правыйСтик.тапТаймер;
      if (время < 250 && !правыйСтик.стрелял) {
        if (состояние === 'игра') выстрел();
      }
      правыйСтик.активен = false;
      правыйСтик.id = null;
    }
  }
}

function нажатьКнопку(к) {
  if (к.ключ === 'перезарядка') начатьПерезарядку();
  if (к.ключ === 'меткийГлаз')  переключитьМеткийГлаз();
  if (к.ключ === 'бег')         бег = true;
}

холст.addEventListener('touchstart', e => {
  e.preventDefault();

  if (состояние === 'меню' || состояние === 'конец') {
    начатьИгру();
    return;
  }
  обработатьКосStart(e);
}, { passive: false });

холст.addEventListener('touchmove', e => {
  e.preventDefault();
  обработатьКосMove(e);
}, { passive: false });

холст.addEventListener('touchend', e => {
  e.preventDefault();
  обработатьКосEnd(e);
}, { passive: false });

холст.addEventListener('touchcancel', e => {
  e.preventDefault();
  обработатьКосEnd(e);
}, { passive: false });

/* ==========================================================
   9. ЛОГИКА ИГРЫ
   ========================================================== */
function начатьИгру() {
  состояние = 'игра';
  время = 0;
  счёт = 0;
  убийств = 0;
  таймерСпавна = 1.0;
  таймерПодсказки = 4;

  игрок.x = 16; игрок.y = 24;
  игрок.угол = -Math.PI / 2;
  игрок.хп = 100;
  игрок.патроны = 6;
  игрок.запас = 42;
  игрок.откатВыстрела = 0;
  игрок.перезарядка = 0;
  игрок.меткийГлаз = 1;
  игрок.мгАктивен = false;
  игрок.тряска = 0;
  игрок.вспышкаСтвола = 0;

  спрайты = [];
  эффекты = [];

  /* Несколько врагов на старте */
  for (let i = 0; i < 5; i++) создатьВрага();

  /* Немного декора — кактусы и бочки */
  разместитьДекор();
}

function разместитьДекор() {
  const клеток = РАЗМЕР_КАРТЫ * РАЗМЕР_КАРТЫ;
  let попыток = 0;
  let кактусов = 0, бочек = 0;

  while ((кактусов < 25 || бочек < 12) && попыток < 800) {
    попыток++;
    const x = случ(1.5, РАЗМЕР_КАРТЫ - 1.5);
    const y = случ(1.5, РАЗМЕР_КАРТЫ - 1.5);

    if (этоСтена(x, y)) continue;
    if (раст(x, y, игрок.x, игрок.y) < 3) continue;

    let занято = false;
    for (const с of спрайты) {
      if (раст(s.x, s.y, x, y) < 1.2) { занято = true; break; }
    }
    if (занято) continue;

    if (кактусов < 25 && (бочек >= 12 || Math.random() < 0.65)) {
      спрайты.push({
        x, y,
        тип: 'кактус',
        текстура: СПРАЙТ_КАКТУС,
        ширина: 0.85,
        высота: 0.85,
        смещение: 0.55, /* смещение от пола — растёт из земли */
        масштабY: 1.0
      });
      кактусов++;
    } else {
      спрайты.push({
        x, y,
        тип: 'бочка',
        текстура: СПРАЙТ_БОЧКА,
        ширина: 0.6,
        высота: 0.6,
        смещение: 0.30,
        масштабY: 1.0
      });
      бочек++;
    }
  }
}

function создатьВрага() {
  for (let попыток = 0; попыток < 100; попыток++) {
    const x = случ(2, РАЗМЕР_КАРТЫ - 2);
    const y = случ(2, РАЗМЕР_КАРТЫ - 2);

    if (этоСтена(x, y)) continue;
    const d = раст(x, y, игрок.x, игрок.y);
    if (d < 6 || d > 20) continue;

    спрайты.push({
      x, y,
      тип: 'враг',
      текстура: СПРАЙТ_КОВБОЙ,
      ширина: 0.7,
      высота: 0.7,
      смещение: 0.0,
      масштабY: 1.0,
      хп: 100,
      максХп: 100,
      угол: 0,
      откатВыстрела: случ(0.8, 2.0),
      скорость: случ(0.7, 1.2),
      вспышка: 0,
      уронВспышка: 0
    });
    return;
  }
}

function переключитьМеткийГлаз() {
  if (состояние !== 'игра') return;
  if (игрок.мгАктивен) { игрок.мгАктивен = false; return; }
  if (игрок.меткийГлаз > 0.15) игрок.мгАктивен = true;
}

function начатьПерезарядку() {
  if (состояние !== 'игра') return;
  if (игрок.перезарядка > 0) return;
  if (игрок.патроны >= игрок.максПатронов) return;
  if (игрок.запас <= 0) return;
  игрок.перезарядка = 1.6;
}

function выстрел() {
  if (игрок.перезарядка > 0) return;
  if (игрок.патроны <= 0) { начатьПерезарядку(); return; }

  игрок.патроны--;
  игрок.откатВыстрела = 0.35;
  игрок.вспышкаСтвола = 0.10;
  игрок.тряска = Math.min(игрок.тряска + 5, 12);

  /* Хитскан по лучу взгляда: ищем ближайшего врага в узком конусе */
  const dirX = Math.cos(игрок.угол);
  const dirY = Math.sin(игрок.угол);

  let ближайший = null, ближайшееРасст = 40;

  for (const с of спрайты) {
    if (с.тип !== 'враг') continue;
    const dx = с.x - игрок.x;
    const dy = с.y - игрок.y;
    const расст = Math.hypot(dx, dy);
    if (расст > 30) continue;

    /* Угол между направлением взгляда и целью */
    const скал = (dx * dirX + dy * dirY) / расст;
    /* Порог зависит от расстояния — как настоящий конус разброса */
    const порог = 1 - Math.min(0.30, 0.06 + расст * 0.006);
    if (скал < порог) continue;

    /* Проверка стен между игроком и целью */
    if (!лучСвободен(игрок.x, игрок.y, с.x, с.y)) continue;

    if (расст < ближайшееРасст) {
      ближайшееРасст = расст;
      ближайший = с;
    }
  }

  if (ближайший) {
    /* Урон зависит от расстояния */
    const урон = игрок.мгАктивен ? 120 : 45;
    ближайший.хп -= урон;
    ближайший.вспышка = 0.20;

    /* Частицы крови в точке попадания */
    for (let i = 0; i < 8; i++) {
      эффекты.push({
        x: ближайший.x, y: ближайший.y,
        vx: случ(-2, 2), vy: случ(-2, 2),
        жизнь: случ(0.3, 0.6), макс: 0.6,
        цвет: '#a3151a', размер: случ(2, 5)
      });
    }

    if (ближайший.хп <= 0) {
      убитьВрага(ближайший);
    }
  }
}

/* Проверка свободного луча (алгоритм DDA по карте) */
function лучСвободен(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const расст = Math.hypot(dx, dy);
  const шагов = Math.ceil(расст * 8);

  for (let i = 1; i < шагов; i++) {
    const t = i / шагов;
    const x = x0 + dx * t;
    const y = y0 + dy * t;
    if (этоСтена(x, y)) return false;
  }
  return true;
}

function убитьВрага(враг) {
  const idx = спрайты.indexOf(враг);
  if (idx >= 0) спрайты.splice(idx, 1);

  счёт += 100;
  убийств++;

  for (let i = 0; i < 20; i++) {
    эффекты.push({
      x: враг.x, y: враг.y,
      vx: случ(-3, 3), vy: случ(-3, 3),
      жизнь: случ(0.4, 0.9), макс: 0.9,
      цвет: i % 3 ? '#a3151a' : '#6d0f12',
      размер: случ(2, 5)
    });
  }
}

/* ==========================================================
   10. ОБНОВЛЕНИЕ ИГРЫ
   ========================================================== */
function обновить(dt) {
  if (состояние !== 'игра') return;

  время += dt;
  if (таймерПодсказки > 0) таймерПодсказки -= dt;

  /* ---- ОБЗОР МЫШЬЮ ---- */
  if (указательЗахвачен && мышь.dx !== 0) {
    игрок.угол += мышь.dx * 0.0025;
    мышь.dx = 0;
  }

  /* ---- ДВИЖЕНИЕ ---- */
  let движВперёд = 0;
  let движВбок = 0;

  if (клавиши.KeyW || клавиши.ArrowUp)    движВперёд += 1;
  if (клавиши.KeyS || клавиши.ArrowDown)  движВперёд -= 1;
  if (клавиши.KeyA) движВбок -= 1;
  if (клавиши.KeyD) движВбок += 1;
  if (клавиши.ArrowLeft)  игрок.угол -= dt * 2.2;
  if (клавиши.ArrowRight) игрок.угол += dt * 2.2;

  /* Тач-стик движения */
  if (левыйСтик.активен) {
    движВперёд += -левыйСтик.dy;
    движВбок    +=  левыйСтик.dx;
  }

  let скорость = 3.2;
  if ((клавиши.ShiftLeft || клавиши.ShiftRight || бег) && !игрок.мгАктивен) скорость *= 1.7;
  if (игрок.мгАктивен) скорость *= 0.45;

  /* Вектор направления */
  const dirX = Math.cos(игрок.угол);
  const dirY = Math.sin(игрок.угол);

  /* Нормализация диагонали */
  const длина = Math.hypot(движВперёд, движВбок) || 1;
  const нВпер = движВперёд / длина;
  const нВбок  = движВбок / длина;

  const новаяX = игрок.x + (dirX * нВпер - dirY * нВбок) * скорость * dt;
  const новаяY = игрок.y + (dirY * нВпер + dirX * нВбок) * скорость * dt;

  /* Раздельно проверяем X и Y — чтобы скользить по стенам */
  if (!этоСтена(новаяX, игрок.y)) игрок.x = новаяX;
  if (!этоСтена(игрок.x, новаяY)) игрок.y = новаяY;

  /* ---- ОГОНЬ ---- */
  if ((мышь.нажата || правыйСтик.активен && правыйСтик.стрелял) && игрок.откатВыстрела <= 0 && игрок.перезарядка <= 0) {
    /* Для мыши — стреляем при удержании (с откатом). Для тача — только при свайпе. */
    if (мышь.нажата) выстрел();
  }

  /* ---- ОТКАТЫ ---- */
  if (игрок.откатВыстрела > 0) игрок.откатВыстрела -= dt;
  if (игрок.вспышкаСтвола > 0) игрок.вспышкаСтвола -= dt;
  if (игрок.тряска > 0) игрок.тряска = Math.max(0, игрок.тряска - dt * 30);

  /* ---- ПЕРЕЗАРЯДКА ---- */
  if (игрок.перезарядка > 0) {
    игрок.перезарядка -= dt;
    if (игрок.перезарядка <= 0) {
      игрок.перезарядка = 0;
      const нужно = игрок.максПатронов - игрок.патроны;
      const взять = Math.min(нужно, игрок.запас);
      игрок.патроны += взять;
      игрок.запас -= взять;
    }
  }

  /* ---- МЕТКИЙ ГЛАЗ ---- */
  if (игрок.мгАктивен) {
    игрок.меткийГлаз -= dt * 0.28;
    if (игрок.меткийГлаз <= 0) {
      игрок.меткийГлаз = 0;
      игрок.мгАктивен = false;
    }
  } else if (игрок.меткийГлаз < 1) {
    игрок.меткийГлаз = Math.min(1, игрок.меткийГлаз + dt * 0.04);
  }

  /* ---- ВРАГИ ---- */
  const множительВремени = игрок.мгАктивен ? 0.4 : 1.0;

  for (let i = спрайты.length - 1; i >= 0; i--) {
    const с = спрайты[i];
    if (с.тип !== 'враг') continue;

    if (с.вспышка > 0) с.вспышка -= dt;
    if (с.уронВспышка > 0) с.уронВспышка -= dt;

    const dx = игрок.x - с.x;
    const dy = игрок.y - с.y;
    const расст = Math.hypot(dx, dy);

    /* Смотрим на игрока */
    с.угол = Math.atan2(dy, dx);

    /* Движение к игроку, если он далеко, или стрейф */
    if (расст > 3) {
      const vx = (dx / расст) * с.скорость * dt * множительВремени;
      const vy = (dy / расст) * с.скорость * dt * множительВремени;

      const новаяВX = с.x + vx;
      const новаяВY = с.y + vy;

      if (!этоСтена(новаяВX, с.y)) с.x = новаяВX;
      if (!этоСтена(с.x, новаяВY)) с.y = новаяВY;
    }

    /* Не подходить вплотную */
    if (расст < 1.0 && расст > 0.01) {
      с.x -= (dx / расст) * 0.5 * dt;
      с.y -= (dy / расст) * 0.5 * dt;
    }

    /* Стрельба по игроку */
    с.откатВыстрела -= dt * множительВремени;
    if (расст < 14 && с.откатВыстрела <= 0 && лучСвободен(с.x, с.y, игрок.x, игрок.y)) {
      с.откатВыстрела = случ(1.5, 3.0);
      с.вспышка = 0.10;

      /* Шанс попасть зависит от расстояния */
      const шанс = огр(1 - расст / 20, 0.15, 0.85);
      if (Math.random() < шанс) {
        ранитьИгрока(случ(6, 12));
      }
    }
  }

  /* ---- ЧАСТИЦЫ ---- */
  for (let i = эффекты.length - 1; i >= 0; i--) {
    const ч = эффекты[i];
    ч.жизнь -= dt;
    if (ч.жизнь <= 0) { эффекты.splice(i, 1); continue; }
    ч.x += ч.vx * dt;
    ч.y += ч.vy * dt;
    ч.vx *= Math.exp(-4 * dt);
    ч.vy *= Math.exp(-4 * dt);
  }

  /* ---- СПАВН ВРАГОВ ---- */
  таймерСпавна -= dt;
  if (таймерСпавна <= 0) {
    const макс = 4 + Math.min(10, Math.floor(время / 20));
    const текущих = спрайты.filter(с => с.тип === 'враг').length;
    if (текущих < макс) создатьВрага();
    таймерСпавна = случ(0.8, 2.0);
  }
}

function ранитьИгрока(урон) {
  игрок.хп -= урон;
  игрок.тряска = Math.min(игрок.тряска + 8, 16);
  if (игрок.хп <= 0) {
    игрок.хп = 0;
    состояние = 'конец';
    if (указательЗахвачен) document.exitPointerLock();
  }
}

/* ==========================================================
   11. RAYCASTING РЕНДЕР
   ========================================================== */
function отрисоватьКадр() {
  /* Небо рисуем как градиент */
  нарисоватьНебо();

  /* Пол + потолок через floor casting */
  нарисоватьПолПотолок();

  /* Стены */
  нарисоватьСтены();

  /* Спрайты */
  нарисоватьСпрайты();

  /* Выводим изображение из буфера */
  offCtx.putImageData(imageData, 0, 0);
}

/* ---- НЕБО (градиент) ---- */
function нарисоватьНебо() {
  const высота_горизонта = Math.floor(ВЫСОТА_БУФ / 2);
  /* От тёмно-синего сверху к тёплому оранжевому у горизонта — закатное небо */
  for (let y = 0; y < высота_горизонта; y++) {
    const t = y / высота_горизонта;
    const r = Math.floor(60 + t * 180);
    const g = Math.floor(80 + t * 100);
    const b = Math.floor(140 + t * 10);
    const ц = цвет(r, g, b);
    const строка = y * ШИРИНА_БУФ;
    for (let x = 0; x < ШИРИНА_БУФ; x++) буфер[строка + x] = ц;
  }
}

/* ---- ПОЛ через floorcasting ---- */
function нарисоватьПолПотолок() {
  const dirX = Math.cos(игрок.угол);
  const dirY = Math.sin(игрок.угол);
  const плоХ = -dirY * ПЛОСКОСТЬ_X;
  const плоY =  dirX * ПЛОСКОСТЬ_X;

  const горизонт = Math.floor(ВЫСОТА_БУФ / 2);

  /* Лучи на левом и правом краях */
  const лучX0 = dirX - плоХ;
  const лучY0 = dirY - плоY;
  const лучX1 = dirX + плоХ;
  const лучY1 = dirY + плоY;

  /* Пол (нижняя половина) */
  for (let y = горизонт + 1; y < ВЫСОТА_БУФ; y++) {
    const p = y - горизонт;
    const позРяда = (0.5 * ВЫСОТА_БУФ) / p;

    const шагX = позРяда * (лучX1 - лучX0) / ШИРИНА_БУФ;
    const шагY = позРяда * (лучY1 - лучY0) / ШИРИНА_БУФ;

    let полX = игрок.x + позРяда * лучX0;
    let полY = игрок.y + позРяда * лучY0;

    const строка = y * ШИРИНА_БУФ;

    /* Затемнение к горизонту */
    const затенение = 1.0 - Math.min(1, p / (ВЫСОТА_БУФ * 0.5)) * 0.3;

    for (let x = 0; x < ШИРИНА_БУФ; x++) {
      const tx = (Math.floor(РАЗМЕР_ТЕКСТУРЫ * (полX - Math.floor(полX)))) & МАСКА_ТЕКСТУРЫ;
      const ty = (Math.floor(РАЗМЕР_ТЕКСТУРЫ * (полY - Math.floor(полY)))) & МАСКА_ТЕКСТУРЫ;

      const ц0 = ТЕКСТУРА_ПОЛА[РАЗМЕР_ТЕКСТУРЫ * ty + tx];
      /* Затенение — просто домножаем каналы */
      const r0 = (ц0 & 0xff) * затенение;
      const g0 = ((ц0 >> 8) & 0xff) * затенение;
      const b0 = ((ц0 >> 16) & 0xff) * затенение;
      буфер[строка + x] = цвет(r0 | 0, g0 | 0, b0 | 0);

      полX += шагX;
      полY += шагY;
    }
  }
}

/* ---- СТЕНЫ (raycasting) ---- */
function нарисоватьСтены() {
  const dirX = Math.cos(игрок.угол);
  const dirY = Math.sin(игрок.угол);
  const плоХ = -dirY * ПЛОСКОСТЬ_X;
  const плоY =  dirX * ПЛОСКОСТЬ_X;

  for (let x = 0; x < ШИРИНА_БУФ; x++) {
    const камераX = 2 * x / ШИРИНА_БУФ - 1;
    const лучX = dirX + плоХ * камераX;
    const лучY = dirY + плоY * камераX;

    let mapX = Math.floor(игрок.x);
    let mapY = Math.floor(игрок.y);

    const дельтаX = лучX === 0 ? 1e30 : Math.abs(1 / лучX);
    const дельтаY = лучY === 0 ? 1e30 : Math.abs(1 / лучY);

    let сторонаX, сторонаY;
    let шагX, шагY;

    if (лучX < 0) {
      шагX = -1;
      сторонаX = (игрок.x - mapX) * дельтаX;
    } else {
      шагX = 1;
      сторонаX = (mapX + 1 - игрок.x) * дельтаX;
    }

    if (лучY < 0) {
      шагY = -1;
      сторонаY = (игрок.y - mapY) * дельтаY;
    } else {
      шагY = 1;
      сторонаY = (mapY + 1 - игрок.y) * дельтаY;
    }

    let сторона = 0;
    let клетка = 0;
    let итераций = 0;

    while (!клетка && итераций < 100) {
      итераций++;
      if (сторонаX < сторонаY) {
        сторонаX += дельтаX;
        mapX += шагX;
        сторона = 0;
      } else {
        сторонаY += дельтаY;
        mapY += шагY;
        сторона = 1;
      }
      if (mapX < 0 || mapY < 0 || mapX >= РАЗМЕР_КАРТЫ || mapY >= РАЗМЕР_КАРТЫ) break;
      клетка = КАРТА[mapY * РАЗМЕР_КАРТЫ + mapX];
    }

    if (!клетка) {
      буферГлубины[x] = 1e30;
      continue;
    }

    /* Перпендикулярное расстояние — убирает «рыбий глаз» */
    const перпРасст = сторона === 0
      ? (mapX - игрок.x + (1 - шагX) / 2) / лучX
      : (mapY - игрок.y + (1 - шагY) / 2) / лучY;

    буферГлубины[x] = перпРасст;

    const высотаЛинии = Math.floor(ВЫСОТА_БУФ / перпРасст);

    let низЭкрана = Math.floor(-высотаЛинии / 2 + ВЫСОТА_БУФ / 2);
    let верхЭкрана = Math.floor( высотаЛинии / 2 + ВЫСОТА_БУФ / 2);

    if (низЭкрана < 0) низЭкрана = 0;
    if (верхЭкрана > ВЫСОТА_БУФ) верхЭкрана = ВЫСОТА_БУФ;

    /* Координата текстуры по X */
    let стенаX = сторона === 0 ? игрок.y + перпРасст * лучY : игрок.x + перпРасст * лучX;
    стенаX -= Math.floor(стенаX);

    let texX = Math.floor(стенаX * РАЗМЕР_ТЕКСТУРЫ);
    if (сторона === 0 && лучX > 0) texX = РАЗМЕР_ТЕКСТУРЫ - texX - 1;
    if (сторона === 1 && лучY < 0) texX = РАЗМЕР_ТЕКСТУРЫ - texX - 1;

    const текстура = ТЕКСТУРЫ[клетка] || ТЕКСТУРЫ[1];

    /* Шаг по текстуре Y */
    const шагТекстуры = РАЗМЕР_ТЕКСТУРЫ / высотаЛинии;
    let texPos = (низЭкрана - ВЫСОТА_БУФ / 2 + высотаЛинии / 2) * шагТекстуры;

    /* Затенение боковых стен */
    const затенение = сторона === 1 ? 0.72 : 1.0;
    /* Дополнительное затенение по расстоянию */
    const затенениеРасст = Math.max(0.25, 1 - перпРасст * 0.045);

    for (let y = низЭкрана; y < верхЭкрана; y++) {
      const texY = texPos & МАСКА_ТЕКСТУРЫ;
      texPos += шагТекстуры;

      const ц0 = текстура[РАЗМЕР_ТЕКСТУРЫ * texY + texX];
      const r0 = (ц0 & 0xff) * затенение * затенениеРасст;
      const g0 = ((ц0 >> 8) & 0xff) * затенение * затенениеРасст;
      const b0 = ((ц0 >> 16) & 0xff) * затенение * затенениеРасст;
      буфер[y * ШИРИНА_БУФ + x] = цвет(r0 | 0, g0 | 0, b0 | 0);
    }
  }
}

/* ---- СПРАЙТЫ (враги, кактусы, бочки) ---- */
function нарисоватьСпрайты() {
  /* Строим массив с расстоянием */
  const список = [];
  for (const с of спрайты) {
    const dx = с.x - игрок.x;
    const dy = с.y - игрок.y;
    с.расст = dx * dx + dy * dy;
    список.push(с);
  }
  /* Сортируем от дальних к ближним */
  список.sort((a, b) => b.расст - a.расст);

  const dirX = Math.cos(игрок.угол);
  const dirY = Math.sin(игрок.угол);
  const плоХ = -dirY * ПЛОСКОСТЬ_X;
  const плоY =  dirX * ПЛОСКОСТЬ_X;

  /* Определитель матрицы камеры */
  const invDet = 1.0 / (плоХ * dirY - dirX * плоY);

  for (const с of список) {
    const спрайтX = с.x - игрок.x;
    const спрайтY = с.y - игрок.y;

    /* Преобразование в пространство камеры */
    const transformX = invDet * (dirY * спрайтX - dirX * спрайтY);
    const transformY = invDet * (-плоY * спрайтX + плоХ * спрайтY);

    if (transformY <= 0.15) continue;

    /* Экранная координата центра спрайта */
    const экранX = Math.floor((ШИРИНА_БУФ / 2) * (1 + transformX / transformY));

    /* Размеры спрайта */
    const высотаСпрайта = Math.abs(Math.floor(ВЫСОТА_БУФ / transformY)) * с.масштабY;
    const ширинаСпрайта = Math.abs(Math.floor(ВЫСОТА_БУФ / transformY)) * (с.ширина / 0.7);

    /* Смещение по вертикали (для высоких спрайтов / на полу) */
    const смещениеY = Math.floor(с.смещение * высотаСпрайта);

    const верхY = -высотаСпрайта / 2 + ВЫСОТА_БУФ / 2 - смещениеY;
    const низY  =  высотаСпрайта / 2 + ВЫСОТА_БУФ / 2 - смещениеY;

    let y0 = Math.max(0, Math.floor(верхY));
    let y1 = Math.min(ВЫСОТА_БУФ, Math.floor(низY));

    let x0 = Math.max(0, Math.floor(экранX - ширинаСпрайта / 2));
    let x1 = Math.min(ШИРИНА_БУФ, Math.floor(экранX + ширинаСпрайта / 2));

    const текстура = с.текстура;
    const затенение = Math.max(0.3, 1 - transformY * 0.05);
    const вспышка = с.вспышка > 0 ? 1 : 0;

    for (let x = x0; x < x1; x++) {
      /* Проверка перекрытия стеной */
      if (transformY >= буферГлубины[x]) continue;

      const texX = Math.floor(((x - (экранX - ширинаСпрайта / 2)) / ширинаСпрайта) * РАЗМЕР_ТЕКСТУРЫ);
      if (texX < 0 || texX >= РАЗМЕР_ТЕКСТУРЫ) continue;

      for (let y = y0; y < y1; y++) {
        const texY = Math.floor(((y - верхY) / (низY - верхY)) * РАЗМЕР_ТЕКСТУРЫ);
        if (texY < 0 || texY >= РАЗМЕР_ТЕКСТУРЫ) continue;

        const ц0 = текстура[РАЗМЕР_ТЕКСТУРЫ * texY + texX];
        const a0 = (ц0 >> 24) & 0xff;
        if (a0 < 128) continue;

        let r0 = (ц0 & 0xff) * затенение;
        let g0 = ((ц0 >> 8) & 0xff) * затенение;
        let b0 = ((ц0 >> 16) & 0xff) * затенение;

        /* Вспышка выстрела врага — подсвечиваем красноватым */
        if (вспышка) {
          r0 = Math.min(255, r0 + 60);
        }
        /* Вспышка урона — красный оттенок */
        if (с.уронВспышка > 0) {
          r0 = Math.min(255, r0 + 80);
          g0 *= 0.5;
          b0 *= 0.5;
        }

        буфер[y * ШИРИНА_БУФ + x] = цвет(r0 | 0, g0 | 0, b0 | 0);
      }
    }
  }

  /* Частицы (эффекты попадания) рисуем как точки поверх */
  for (const ч of эффекты) {
    const спрайтX = ч.x - игрок.x;
    const спрайтY = ч.y - игрок.y;
    const transformX = invDet * (dirY * спрайтX - dirX * спрайтY);
    const transformY = invDet * (-плоY * спрайтX + плоХ * спрайтY);
    if (transformY <= 0.15) continue;

    const экранX = Math.floor((ШИРИНА_БУФ / 2) * (1 + transformX / transformY));
    const экранY = Math.floor(ВЫСОТА_БУФ / 2 + 4 / transformY);

    /* Размер частицы на экране */
    const размер = Math.max(1, Math.floor(3 / transformY));

    const a0 = ч.жизнь / ч.макс;
    const r0 = parseInt(ч.цвет.slice(1, 3), 16);
    const g0 = parseInt(ч.цвет.slice(3, 5), 16);
    const b0 = parseInt(ч.цвет.slice(5, 7), 16);

    for (let dy = -размер; dy <= размер; dy++) {
      for (let dx = -размер; dx <= размер; dx++) {
        const x = экранX + dx;
        const y = экранY + dy;
        if (x < 0 || x >= ШИРИНА_БУФ || y < 0 || y >= ВЫСОТА_БУФ) continue;
        if (transformY >= буферГлубины[x]) continue;
        const r1 = Math.min(255, r0 * a0 + ((буфер[y * ШИРИНА_БУФ + x] & 0xff) * (1 - a0)));
        const g1 = Math.min(255, g0 * a0 + (((буфер[y * ШИРИНА_БУФ + x] >> 8) & 0xff) * (1 - a0)));
        const b1 = Math.min(255, b0 * a0 + (((буфер[y * ШИРИНА_БУФ + x] >> 16) & 0xff) * (1 - a0)));
        буфер[y * ШИРИНА_БУФ + x] = цвет(r1 | 0, g1 | 0, b1 | 0);
      }
    }
  }
}

/* ==========================================================
   12. ОТРИСОВКА ПОВЕРХ 3D — оружие, HUD, стики
   ========================================================== */
function нарисоватьПоверх() {
  /* Тряска камеры */
  let тряскаX = 0, тряскаY = 0;
  if (игрок.тряска > 0) {
    тряскаX = (Math.random() - 0.5) * игрок.тряска * 4;
    тряскаY = (Math.random() - 0.5) * игрок.тряска * 4;
  }

  /* Заливаем фон чёрным и рисуем масштабированное 3D-изображение */
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, Ш_ЭКРАНА, В_ЭКРАНА);

  ctx.drawImage(
    offCanvas,
    -Ш_ЭКРАНА * 0 + тряскаX,
    тряскаY,
    Ш_ЭКРАНА,
    В_ЭКРАНА
  );

  /* Меню / Конец — без оружия */
  if (состояние === 'меню') { нарисоватьМеню(); return; }
  if (состояние === 'конец') { нарисоватьКонец(); return; }

  /* Оружие (револьвер) */
  нарисоватьРевольвер();

  /* Прицел */
  нарисоватьПрицел();

  /* Мини-карта */
  нарисоватьМиниКарту();

  /* HUD (полоса здоровья, патроны, счёт) */
  нарисоватьHUD();

  /* Вспышка урона */
  const вспышка = Math.max(0, (100 - игрок.хп) / 100 - 0.3);
  if (вспышка > 0) {
    const гр = ctx.createRadialGradient(Ш_ЭКРАНА / 2, В_ЭКРАНА / 2, Math.min(Ш_ЭКРАНА, В_ЭКРАНА) * 0.2,
                                          Ш_ЭКРАНА / 2, В_ЭКРАНА / 2, Math.max(Ш_ЭКРАНА, В_ЭКРАНА) * 0.7);
    гр.addColorStop(0, 'rgba(120,0,0,0)');
    гр.addColorStop(1, 'rgba(140,10,10,' + (вспышка * 0.9) + ')');
    ctx.fillStyle = гр;
    ctx.fillRect(0, 0, Ш_ЭКРАНА, В_ЭКРАНА);
  }

  /* Эффект Меткого глаза */
  if (игрок.мгАктивен) {
    /* Лёгкая тёплая тонировка */
    ctx.fillStyle = 'rgba(160,120,20,0.08)';
    ctx.fillRect(0, 0, Ш_ЭКРАНА, В_ЭКРАНА);
    /* Виньетка жёлто-коричневая */
    const гр = ctx.createRadialGradient(Ш_ЭКРАНА / 2, В_ЭКРАНА / 2, Math.min(Ш_ЭКРАНА, В_ЭКРАНА) * 0.15,
                                          Ш_ЭКРАНА / 2, В_ЭКРАНА / 2, Math.max(Ш_ЭКРАНА, В_ЭКРАНА) * 0.6);
    гр.addColorStop(0, 'rgba(0,0,0,0)');
    гр.addColorStop(1, 'rgba(50,30,0,0.55)');
    ctx.fillStyle = гр;
    ctx.fillRect(0, 0, Ш_ЭКРАНА, В_ЭКРАНА);
  }

  /* Подсказка в начале */
  if (таймерПодсказки > 0) {
    const a = Math.min(1, таймерПодсказки / 0.6);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(240,220,174,0.9)';
    ctx.font = 'bold 16px Georgia, serif';
    ctx.textAlign = 'center';
    const сообщение = ЭТО_ТАЧ
      ? 'Левый палец — движение · Правый — обзор, тап — выстрел'
      : 'WASD — движение · Мышь — обзор · ЛКМ — огонь · R — перезарядка · Q — Меткий глаз';
    ctx.fillText(сообщение, Ш_ЭКРАНА / 2, 60);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
}

/* ---- Револьвер в руках ---- */
function нарисоватьРевольвер() {
  const откат = игрок.откатВыстрела > 0 ? (игрок.откатВыстрела / 0.35) * 22 : 0;
  const покачивание = Math.sin(performance.now() / 300) * 2;

  /* Прицел-центр */
  const цX = Ш_ЭКРАНА / 2;
  const цY = В_ЭКРАНА;

  ctx.save();
  ctx.translate(цX + 110 + покачивание, цY + 30 + откат);

  /* Тень оружия */
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, 10, 70, 20, 0, 0, ДВА_ПИ);
  ctx.fill();

  /* Ствол */
  ctx.fillStyle = '#22222a';
  ctx.fillRect(-110, -34, 90, 12);
  ctx.fillStyle = '#0f0f14';
  ctx.fillRect(-110, -26, 90, 4);

  /* Блик на стволе */
  ctx.fillStyle = 'rgba(220,220,255,0.25)';
  ctx.fillRect(-108, -32, 86, 2);

  /* Барабан */
  ctx.fillStyle = '#3a3a44';
  ctx.beginPath();
  ctx.ellipse(-16, -28, 14, 14, 0, 0, ДВА_ПИ);
  ctx.fill();
  ctx.strokeStyle = '#0f0f14';
  ctx.lineWidth = 2;
  ctx.stroke();

  /* Камеры барабана */
  ctx.fillStyle = '#1a1a22';
  for (let i = 0; i < 6; i++) {
    const уг = (i / 6) * ДВА_ПИ;
    ctx.beginPath();
    ctx.arc(-16 + Math.cos(уг) * 7, -28 + Math.sin(уг) * 7, 2.2, 0, ДВА_ПИ);
    ctx.fill();
  }

  /* Рукоятка */
  ctx.fillStyle = '#5a3a20';
  ctx.beginPath();
  ctx.moveTo(-16, -20);
  ctx.lineTo(6, -12);
  ctx.lineTo(16, 22);
  ctx.lineTo(-2, 30);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#2a1a08';
  ctx.lineWidth = 2;
  ctx.stroke();

  /* Накладки на рукоятке */
  ctx.fillStyle = 'rgba(255,220,160,0.15)';
  ctx.beginPath();
  ctx.moveTo(-10, -14);
  ctx.lineTo(0, -8);
  ctx.lineTo(10, 18);
  ctx.lineTo(2, 24);
  ctx.closePath();
  ctx.fill();

  /* Курок */
  ctx.fillStyle = '#1a1a22';
  ctx.fillRect(-32, -40, 6, 14);

  /* Спусковая скоба */
  ctx.strokeStyle = '#1a1a22';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(-6, -14, 12, Math.PI * 0.1, Math.PI * 0.9, true);
  ctx.stroke();

  /* Вспышка выстрела */
  if (игрок.вспышкаСтвола > 0) {
    const яр = игрок.вспышкаСтвола / 0.10;
    const гр = ctx.createRadialGradient(-110, -28, 2, -110, -28, 60 * яр);
    гр.addColorStop(0, 'rgba(255,255,200,' + яр + ')');
    гр.addColorStop(0.4, 'rgba(255,200,80,' + (яр * 0.7) + ')');
    гр.addColorStop(1, 'rgba(255,100,20,0)');
    ctx.fillStyle = гр;
    ctx.beginPath();
    ctx.arc(-110, -28, 60 * яр, 0, ДВА_ПИ);
    ctx.fill();

    /* Оранжевый круг */
    ctx.fillStyle = 'rgba(255,220,120,' + яр + ')';
    ctx.beginPath();
    ctx.arc(-110, -28, 10 * яр, 0, ДВА_ПИ);
    ctx.fill();
  }

  ctx.restore();

  /* Прицел (по центру) */
  ctx.strokeStyle = 'rgba(255,246,220,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(цX - 12, цY / 2); ctx.lineTo(цX - 4, цY / 2);
  ctx.moveTo(цX + 4, цY / 2); ctx.lineTo(цX + 12, цY / 2);
  ctx.moveTo(цX, цY / 2 - 12); ctx.lineTo(цX, цY / 2 - 4);
  ctx.moveTo(цX, цY / 2 + 4); ctx.lineTo(цX, цY / 2 + 12);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,246,220,0.9)';
  ctx.beginPath();
  ctx.arc(цX, цY / 2, 2, 0, ДВА_ПИ);
  ctx.fill();
}

/* ---- Мини-карта ---- */
function нарисоватьМиниКарту() {
  const S = 140;
  const px = Ш_ЭКРАНА - S - 20;
  const py = 20;
  const дальность = 12;
  const к = S / (дальность * 2);
  const цx = px + S / 2;
  const цy = py + S / 2;

  ctx.save();
  ctx.beginPath();
  ctx.rect(px, py, S, S);
  ctx.clip();

  ctx.fillStyle = 'rgba(22,14,7,0.82)';
  ctx.fillRect(px, py, S, S);

  /* Стены */
  for (let y = 0; y < РАЗМЕР_КАРТЫ; y++) {
    for (let x = 0; x < РАЗМЕР_КАРТЫ; x++) {
      const клетка = КАРТА[y * РАЗМЕР_КАРТЫ + x];
      if (!клетка) continue;
      const worldX = x + 0.5;
      const worldY = y + 0.5;
      const dx = worldX - игрок.x;
      const dy = worldY - игрок.y;
      if (Math.abs(dx) > дальность || Math.abs(dy) > дальность) continue;

      const экX = цx + dx * к;
      const экY = цy + dy * к;

      let цвет0;
      if (клетка === 1) цвет0 = 'rgba(150,110,60,0.9)';
      else if (клетка === 2) цвет0 = 'rgba(140,80,60,0.9)';
      else if (клетка === 3) цвет0 = 'rgba(120,115,108,0.9)';
      else if (клетка === 4) цвет0 = 'rgba(200,170,80,0.95)';
      else цвет0 = 'rgba(150,110,60,0.9)';
      ctx.fillStyle = цвет0;
      ctx.fillRect(экX - к * 0.5, экY - к * 0.5, к, к);
    }
  }

  /* Враги */
  for (const с of спрайты) {
    if (с.тип !== 'враг') continue;
    const dx = с.x - игрок.x;
    const dy = с.y - игрок.y;
    if (Math.abs(dx) > дальность || Math.abs(dy) > дальность) continue;
    ctx.fillStyle = '#e0503c';
    ctx.beginPath();
    ctx.arc(цx + dx * к, цy + dy * к, 3, 0, ДВА_ПИ);
    ctx.fill();
  }

  /* Декор — зелёным */
  for (const с of спрайты) {
    if (с.тип !== 'кактус' && с.тип !== 'бочка') continue;
    const dx = с.x - игрок.x;
    const dy = с.y - игрок.y;
    if (Math.abs(dx) > дальность || Math.abs(dy) > дальность) continue;
    ctx.fillStyle = с.тип === 'кактус' ? 'rgba(80,140,80,0.9)' : 'rgba(160,110,60,0.9)';
    ctx.beginPath();
    ctx.arc(цx + dx * к, цy + dy * к, 2, 0, ДВА_ПИ);
    ctx.fill();
  }

  /* Игрок и его взгляд */
  ctx.fillStyle = '#fff6d8';
  ctx.beginPath();
  ctx.arc(цx, цy, 4, 0, ДВА_ПИ);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,246,216,0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(цx, цy);
  ctx.lineTo(цx + Math.cos(игрок.угол) * 18, цy + Math.sin(игрок.угол) * 18);
  ctx.stroke();

  /* Сектор обзора */
  ctx.fillStyle = 'rgba(255,200,120,0.10)';
  ctx.beginPath();
  ctx.moveTo(цx, цy);
  ctx.arc(цx, цy, 40, игрок.угол - 0.5, игрок.угол + 0.5);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  /* Рамка */
  ctx.strokeStyle = 'rgba(220,190,140,0.55)';
  ctx.lineWidth = 2;
  ctx.strokeRect(px, py, S, S);
  ctx.fillStyle = 'rgba(220,190,140,0.7)';
  ctx.font = 'bold 11px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('КАРТА', px + 5, py - 6);
}

/* ---- HUD ---- */
function нарисоватьHUD() {
  /* Здоровье */
  const бw = 250, бh = 14, бx = 26, бy = В_ЭКРАНА - 118;

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(бx - 6, бy - 6, бw + 12, бh + 12);

  ctx.fillStyle = 'rgba(58,20,15,0.9)';
  ctx.fillRect(бx, бy, бw, бh);

  const шз = бw * (игрок.хп / игрок.максХп);
  if (шз > 0) {
    const гр = ctx.createLinearGradient(бx, бy, бx, бy + бh);
    гр.addColorStop(0, '#e0503c');
    гр.addColorStop(1, '#8f1d16');
    ctx.fillStyle = гр;
    ctx.fillRect(бx, бy, шз, бh);
  }

  ctx.strokeStyle = 'rgba(230,200,150,0.35)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(бx, бy, бw, бh);
  ctx.fillStyle = 'rgba(240,220,174,0.7)';
  ctx.font = 'bold 11px Georgia, serif';
  ctx.fillText('ЗДОРОВЬЕ', бx + 2, бy - 8);

  /* Меткий глаз */
  const дy = бy + бh + 16, дh = 9;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(бx - 6, дy - 6, бw + 12, дh + 12);
  ctx.fillStyle = 'rgba(48,36,14,0.9)';
  ctx.fillRect(бx, дy, бw, дh);
  const шд = бw * игрок.меткийГлаз;
  if (шд > 0) {
    ctx.fillStyle = игрок.мгАктивен ? '#fff2b0' : '#d8a83a';
    ctx.fillRect(бx, дy, шд, дh);
  }
  ctx.strokeStyle = 'rgba(230,200,150,0.35)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(бx, дy, бw, дh);
  ctx.fillStyle = 'rgba(240,220,174,0.7)';
  ctx.fillText('МЕТКИЙ ГЛАЗ', бx + 2, дy - 6);

  /* Патроны */
  ctx.font = 'bold 30px Georgia, serif';
  ctx.fillStyle = игрок.патроны > 0 ? '#f0dcae' : '#c0392b';
  ctx.fillText(игрок.патроны + ' / ' + игрок.запас, бx, дy + дh + 40);
  ctx.font = 'bold 11px Georgia, serif';
  ctx.fillStyle = 'rgba(240,220,174,0.55)';
  ctx.fillText('ПАТРОНЫ', бx + 2, дy + дh + 54);

  /* Счёт */
  ctx.textAlign = 'right';
  ctx.font = 'bold 24px Georgia, serif';
  ctx.fillStyle = '#f0dcae';
  ctx.fillText('$ ' + счёт, Ш_ЭКРАНА - 26, 190);
  ctx.font = '13px Georgia, serif';
  ctx.fillStyle = 'rgba(240,220,174,0.65)';
  ctx.fillText('Убито: ' + убийств, Ш_ЭКРАНА - 26, 210);
  ctx.fillText('Время: ' + Math.floor(время) + 'с', Ш_ЭКРАНА - 26, 228);
  ctx.textAlign = 'left';

  /* Индикатор перезарядки по центру */
  if (игрок.перезарядка > 0) {
    const прогр = 1 - игрок.перезарядка / 1.6;
    const цx = Ш_ЭКРАНА / 2;
    const цy = В_ЭКРАНА / 2 + 40;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(цx, цy, 20, -Math.PI / 2, -Math.PI / 2 + ДВА_ПИ);
    ctx.stroke();
    ctx.strokeStyle = '#e8c98a';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(цx, цy, 20, -Math.PI / 2, -Math.PI / 2 + ДВА_ПИ * прогр);
    ctx.stroke();
    ctx.fillStyle = 'rgba(240,220,174,0.9)';
    ctx.font = 'bold 12px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('ПЕРЕЗАРЯДКА', цx, цy + 42);
    ctx.textAlign = 'left';
  }

  /* Стики и кнопки — только на тач */
  if (ЭТО_ТАЧ) {
    нарисоватьКнопкиТач();
    нарисоватьСтик(левыйСтик, 'rgba(220,190,140,0.55)');
    /* Правый стик показываем только когда активен — с индикацией прицела */
    if (правыйСтик.активен) {
      ctx.save();
      ctx.strokeStyle = 'rgba(220,120,60,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(правыйСтик.ox, правыйСтик.oy, 40, 0, ДВА_ПИ);
      ctx.stroke();
      ctx.fillStyle = 'rgba(220,120,60,0.5)';
      ctx.beginPath();
      ctx.arc(правыйСтик.ox, правыйСтик.oy, 12, 0, ДВА_ПИ);
      ctx.fill();
      ctx.restore();
    }
  }
}

/* ---- Кнопки тача ---- */
function нарисоватьКнопкиТач() {
  for (const к of кнопки) {
    const x = к.x(), y = к.y(), r = к.r;

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(x, y + 2, r + 2, 0, ДВА_ПИ); ctx.fill();

    const гр = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 2, x, y, r);
    гр.addColorStop(0, к.цвет);
    гр.addColorStop(1, 'rgba(40,25,12,0.9)');
    ctx.fillStyle = гр;
    ctx.beginPath(); ctx.arc(x, y, r, 0, ДВА_ПИ); ctx.fill();

    ctx.strokeStyle = 'rgba(220,190,140,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, ДВА_ПИ); ctx.stroke();

    ctx.fillStyle = '#f0dcae';
    ctx.font = 'bold 13px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(к.метка, x, y + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.restore();
  }
}

/* ---- Стик ---- */
function нарисоватьСтик(ст, цвет_ст) {
  if (!ст.активен) return;
  const { ox, oy, x, y } = ст;

  ctx.save();
  ctx.fillStyle = 'rgba(20,12,6,0.30)';
  ctx.beginPath(); ctx.arc(ox, oy, РАДИУС_СТИКА, 0, ДВА_ПИ); ctx.fill();
  ctx.strokeStyle = 'rgba(220,190,140,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(ox, oy, РАДИУС_СТИКА, 0, ДВА_ПИ); ctx.stroke();

  const dx = x - ox, dy = y - oy;
  const дл = Math.hypot(dx, dy);
  const макс = РАДИУС_СТИКА;
  let кx, кy;
  if (дл > макс) {
    кx = ox + dx / дл * макс;
    кy = oy + dy / дл * макс;
  } else {
    кx = x; кy = y;
  }

  const гр = ctx.createRadialGradient(кx, кy, 2, кx, кy, 30);
  гр.addColorStop(0, цвет_ст);
  гр.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = гр;
  ctx.beginPath(); ctx.arc(кx, кy, 30, 0, ДВА_ПИ); ctx.fill();

  ctx.fillStyle = 'rgba(240,220,174,0.85)';
  ctx.beginPath(); ctx.arc(кx, кy, 20, 0, ДВА_ПИ); ctx.fill();
  ctx.strokeStyle = 'rgba(90,60,25,0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(кx, кy, 20, 0, ДВА_ПИ); ctx.stroke();

  ctx.restore();
}

/* ---- Меню ---- */
function нарисоватьМеню() {
  ctx.fillStyle = 'rgba(14,9,5,0.85)';
  ctx.fillRect(0, 0, Ш_ЭКРАНА, В_ЭКРАНА);

  const гр = ctx.createRadialGradient(Ш_ЭКРАНА / 2, В_ЭКРАНА / 2, 50, Ш_ЭКРАНА / 2, В_ЭКРАНА / 2, Math.max(Ш_ЭКРАНА, В_ЭКРАНА) * 0.85);
  гр.addColorStop(0, 'rgba(90,60,25,0.35)');
  гр.addColorStop(1, 'rgba(0,0,0,0.9)');
  ctx.fillStyle = гр;
  ctx.fillRect(0, 0, Ш_ЭКРАНА, В_ЭКРАНА);

  ctx.textAlign = 'center';

  ctx.fillStyle = '#e8c98a';
  ctx.font = 'bold ' + Math.min(64, Ш_ЭКРАНА / 12) + 'px Georgia, serif';
  ctx.fillText('RED DEAD 3D', Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 - 130);

  ctx.fillStyle = 'rgba(232,201,138,0.55)';
  ctx.font = Math.min(20, Ш_ЭКРАНА / 32) + 'px Georgia, serif';
  ctx.fillText('— вестерн от первого лица —', Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 - 88);

  ctx.fillStyle = 'rgba(232,220,190,0.88)';
  ctx.font = Math.min(16, Ш_ЭКРАНА / 48) + 'px Georgia, serif';

  const строки = ЭТО_ТАЧ ? [
    'Левый палец — виртуальный стик движения',
    'Правый палец — обзор, тап — выстрел',
    'Кнопки: ПЕР — перезарядка, ГЛАЗ — Меткий глаз, БЕГ — бег'
  ] : [
    'WASD — движение        Мышь — обзор        ЛКМ — огонь',
    'R — перезарядка        Q — Меткий глаз    Shift — бег',
    'Целься мышью в центр экрана — там летят пули'
  ];

  строки.forEach((т, i) => {
    ctx.fillText(т, Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 - 20 + i * 32);
  });

  const пульс = 0.55 + Math.sin(performance.now() / 350) * 0.45;
  ctx.fillStyle = 'rgba(255,225,150,' + пульс + ')';
  ctx.font = 'bold ' + Math.min(24, Ш_ЭКРАНА / 30) + 'px Georgia, serif';
  ctx.fillText(ЭТО_ТАЧ ? 'КОСНИСЬ ЭКРАНА, ЧТОБЫ НАЧАТЬ' : 'КЛИКНИ ИЛИ ПРОБЕЛ — НАЧАТЬ',
               Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 + 150);

  ctx.textAlign = 'left';
}

/* ---- Конец игры ---- */
function нарисоватьКонец() {
  ctx.fillStyle = 'rgba(30,4,4,0.72)';
  ctx.fillRect(0, 0, Ш_ЭКРАНА, В_ЭКРАНА);

  ctx.textAlign = 'center';

  ctx.fillStyle = '#c0392b';
  ctx.font = 'bold ' + Math.min(72, Ш_ЭКРАНА / 10) + 'px Georgia, serif';
  ctx.fillText('ТЫ ПОГИБ', Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 - 80);

  ctx.fillStyle = '#e8c98a';
  ctx.font = 'bold 30px Georgia, serif';
  ctx.fillText('$ ' + счёт, Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 + 6);

  ctx.fillStyle = 'rgba(232,220,190,0.85)';
  ctx.font = Math.min(18, Ш_ЭКРАНА / 44) + 'px Georgia, serif';
  ctx.fillText('Врагов уложено: ' + убийств, Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 + 48);
  ctx.fillText('Продержался: ' + Math.floor(время) + ' секунд', Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 + 76);

  const пульс = 0.55 + Math.sin(performance.now() / 350) * 0.45;
  ctx.fillStyle = 'rgba(255,225,150,' + пульс + ')';
  ctx.font = 'bold ' + Math.min(22, Ш_ЭКРАНА / 36) + 'px Georgia, serif';
  ctx.fillText(ЭТО_ТАЧ ? 'КОСНИСЬ ЭКРАНА — НАЧАТЬ ЗАНОВО' : 'НАЖМИ  R  ЧТОБЫ НАЧАТЬ ЗАНОВО',
               Ш_ЭКРАНА / 2, В_ЭКРАНА / 2 + 150);

  ctx.textAlign = 'left';
}

/* ==========================================================
   13. ГЛАВНЫЙ ЦИКЛ
   ========================================================== */
let последнийКадр = performance.now();

function цикл(t) {
  let dt = (t - последнийКадр) / 1000;
  последнийКадр = t;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  обновить(dt);

  if (состояние === 'игра' || состояние === 'конец' || состояние === 'меню') {
    /* В меню и в конце рисуем 3D-вид в фоне */
    отрисоватьКадр();
  }

  нарисоватьПоверх();

  requestAnimationFrame(цикл);
}

/* ==========================================================
   14. СТАРТ
   ========================================================== */
/* Пробуем включить звук при первом взаимодействии */
function включитьЗвук() {
  /* Заглушка — в этой версии звук не используется */
}

/* Скрываем адресную строку iOS */
window.addEventListener('touchstart', function однажды() {
  window.removeEventListener('touchstart', однажды);
  window.scrollTo(0, 1);
}, { passive: true });

/* Запрет случайного зума двумя пальцами */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());

/* Запуск */
requestAnimationFrame(цикл);
</script>
